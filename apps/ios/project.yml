# The iOS app as an Xcode project, for what SwiftPM cannot do: sign and
# archive an app for a device, and drive it from a UI test. Generated by `just ios-project`, never
# checked in — the sources are the macOS app's, and a second hand-kept list of
# them would drift.
#
# ${KOAN_*} values come from the environment at generation time; the recipes
# set them.
name: Koan
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${KOAN_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    # The generated bindings import a C module that SwiftPM finds through its
    # system library target. Here it is named directly.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/../macos/Sources/koan_ffiFFI
    OTHER_SWIFT_FLAGS: >-
      -package-name koan
      -Xcc -fmodule-map-file=$(SRCROOT)/../macos/Sources/koan_ffiFFI/module.modulemap

targets:
  # Its own module, as in the package: the app says `import KoanFFI`.
  KoanFFI:
    type: library.static
    platform: iOS
    sources:
      - path: ../macos/Sources/KoanFFI

  Koan:
    type: application
    platform: iOS
    sources:
      - path: ../macos/Sources/KoanIOS
      - path: ../macos/Sources/Koan
        # The macOS shell: the scene root, the menu bar and what serves it.
        # The same list `ios-typecheck` and `ios-bundle` leave out.
        excludes:
          - KoanApp.swift
          - Support/Hotkeys.swift
          - Support/TextFocus.swift
          - Support/EditCommands.swift
          - Support/MenuShortcuts.swift
          - Views/ShortcutsSheet.swift
      - path: ../macos/Resources/Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - target: KoanFFI
      # The Live Activity for another device this phone controls.
      - target: KoanWidgets
      - target: NotificationService
      # "Share → kōan" for EQ and filter files and text.
      - target: KoanShare
    settings:
      base:
        PRODUCT_NAME: koan
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # `just ios-ffi <platform>` stages the Rust archive per SDK, so a
        # device and a simulator build never link each other's slice.
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/ios-link/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lkoan_ffi
    # Push. `development` is the sandbox gateway a development build's token
    # belongs to; exporting for the App Store rewrites it to `production`.
    entitlements:
      path: ../../target/ios-project/koan.entitlements
      properties:
        aps-environment: development
        # A request to play reaches through Focus: it was asked for just now.
        com.apple.developer.usernotifications.time-sensitive: true
        # Invite links open the app rather than the join page.
        com.apple.developer.associated-domains:
          - applinks:koan.rocks
        # Where the share extension leaves what it was handed.
        com.apple.security.application-groups:
          - group.cc.blit.koan
    info:
      path: ../../target/ios-project/Info.plist
      properties:
        CFBundleDisplayName: kōan
        # XcodeGen writes 1.0 and 1 here unless told otherwise, whatever the
        # build settings above say, and App Store Connect reads these.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # `koan://join`, the join page's button where a universal link did not
        # open the app.
        CFBundleURLTypes:
          - CFBundleURLName: cc.blit.koan
            CFBundleURLSchemes: [koan]
        # The ensō on the icon's ground, drawn by the system before koan has
        # run a line. `Splash` repeats it exactly, so the handoff is invisible.
        UILaunchScreen:
          UIImageName: LaunchEnso
          UIColorName: LaunchBackground
        # "Open in kōan" for EQ and correction filters, from Files, Mail or a
        # chat. Alternate: koan is never the app these files belong to.
        CFBundleDocumentTypes:
          - CFBundleTypeName: EQ or correction filter
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pkware.zip-archive
              - public.plain-text
              - public.yaml
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - org.xiph.flac
        LSSupportsOpeningDocumentsInPlace: false
        # Without this the process is suspended when the screen locks, and the
        # audio thread with it.
        # `remote-notification`: a background push from the server wakes the
        # app to link and take what waits for it. See `PushDelegate`.
        UIBackgroundModes: [audio, remote-notification]
        # A Navidrome on the home network is the common case, and iOS refuses
        # connections to local addresses until the user has been asked. The
        # engine's HTTP is its own sockets rather than URLSession, so App
        # Transport Security does not apply; local network privacy does.
        NSLocalNetworkUsageDescription: >-
          koan connects to your music server when it is on your local network,
          and finds other koan apps on it to play music on.
        # How koan apps on one network find each other. See `remote::nearby`.
        NSBonjourServices: [_koan._tcp]
        # Controlling another device shows it on the lock screen.
        NSSupportsLiveActivities: true
        # HTTPS and nothing else, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Draws the Live Activity; the intents its buttons run are the app's.
  KoanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: ../macos/Sources/KoanIOS/RemoteActivity.swift
    settings:
      base:
        PRODUCT_NAME: KoanWidgets
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.widgets
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
        # Nothing here imports the engine.
        OTHER_SWIFT_FLAGS: -package-name koan
        SWIFT_INCLUDE_PATHS: ""
    info:
      path: ../../target/ios-project/Widgets-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Attaches the album cover to a notification before it is shown.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.NotificationService
        # App Store Connect refuses an extension whose version differs from
        # its app's.
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ../../target/ios-project/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # Takes EQ and filter files, or text, shared from another app and leaves
  # them in the app group for the app to import. See `ShareViewController`.
  KoanShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
    settings:
      base:
        PRODUCT_NAME: KoanShare
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.share
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_SWIFT_FLAGS: -package-name koan
        SWIFT_INCLUDE_PATHS: ""
    entitlements:
      path: ../../target/ios-project/KoanShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cc.blit.koan
    info:
      path: ../../target/ios-project/KoanShare-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 10

  KoanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Koan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Koan:
    build:
      targets:
        Koan: all
    test:
      targets:
        - KoanUITests
    archive:
      config: Release
