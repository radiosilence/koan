# The iOS app as an Xcode project, for what SwiftPM cannot do: sign and
# archive an app for a device, and drive it from a UI test. Generated by `just ios-project`, never
# checked in: XcodeGen reads the source directories, so no hand-kept list of
# files drifts.
#
# ${KOAN_*} values come from the environment at generation time; the recipes
# set them.
name: Koan
options:
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${KOAN_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    # The generated bindings import a C module, named here directly.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/koan_ffiFFI
    OTHER_SWIFT_FLAGS: >-
      -package-name koan
      -Xcc -fmodule-map-file=$(SRCROOT)/Sources/koan_ffiFFI/module.modulemap

targets:
  # Its own module: the app says `import KoanFFI`.
  KoanFFI:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/KoanFFI
    settings:
      base:
        # The bindings run an engine call on the caller's actor up to its
        # first poll, which is when it joins the engine's command lane, so
        # commands made on the main actor reach the lane in the order they
        # were made. Without it every call starts on the cooperative pool.
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES

  # The kōan GUI app: GPUI in Rust, linked as one static library with the
  # uniffi bindings, entered from `Sources/KoanGUI/main.swift`. Swift remains
  # for push, App Attest, the Live Activity, watching the network and saving on
  # leaving, driving
  # the same engine (`opened_engine`).
  Koan:
    type: application
    platform: iOS
    sources:
      - path: Sources/KoanGUI
      - path: Sources/KoanIOS/PushDelegate.swift
      - path: Sources/KoanIOS/AppAttest.swift
      - path: Sources/KoanIOS/RemoteActivity.swift
      - path: Sources/Koan/Support/NetworkWatch.swift
      - path: Resources/Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - target: KoanFFI
      # The Live Activity for another device this phone controls.
      - target: KoanWidgets
      - target: NotificationService
      # "Share → kōan" for EQ and filter files and text.
      - target: KoanShare
    settings:
      base:
        # The name the Info.plist's CFBundleExecutable and the plain cargo
        # bundles give the binary.
        PRODUCT_NAME: koan-gui
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The one file the Xcode app and `just gui-ios`/`gui-phone` share.
        INFOPLIST_FILE: ../../crates/koan-gui/ios/Info.plist
        # `just gui-ios-lib <platform>` stages the Rust archive per SDK.
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/gui-link/$(PLATFORM_NAME)
        OTHER_LDFLAGS: >-
          -lkoan_gui -lobjc -liconv -framework MediaPlayer -framework CoreGraphics
          -framework AVFAudio -framework Security -framework AudioToolbox
          -framework CoreAudio -framework OpenAL -framework SafariServices
          -framework UIKit -framework CoreText -framework QuartzCore
          -framework CoreVideo -framework Metal -framework Foundation
          -framework CoreFoundation
    # Push. `development` is the sandbox gateway a development build's token
    # belongs to; exporting for the App Store rewrites it to `production`.
    entitlements:
      path: ../../target/ios-project/koan.entitlements
      properties:
        aps-environment: development
        # SSDP, which UPnP renderers are found by, is multicast, and iOS
        # refuses multicast to an app without this.
        com.apple.developer.networking.multicast: true
        # App Attest, which the push relay asks of every registration on the
        # production gateway: Apple's development environment for builds
        # signed for a device.
        com.apple.developer.devicecheck.appattest-environment: development
        # A request to play reaches through Focus: it was asked for just now.
        com.apple.developer.usernotifications.time-sensitive: true
        # Invite links open the app rather than the join page.
        com.apple.developer.associated-domains:
          - applinks:koan.rocks
        # Where the share extension leaves what it was handed.
        com.apple.security.application-groups:
          - group.cc.blit.koan

  # The same module for tvOS, which links its own Rust slice.
  KoanFFITV:
    type: library.static
    platform: tvOS
    sources:
      - path: Sources/KoanFFI
    settings:
      base:
        PRODUCT_MODULE_NAME: KoanFFI
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES

  # The shared sources on the Apple TV. Push, extensions and the Live Activity
  # are the phone's; ActivityKit does not exist on tvOS.
  KoanTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/KoanIOS
        excludes:
          - RemoteActivity.swift
      - path: Sources/KoanTV
      - path: Sources/Koan
      - path: Resources/Assets.xcassets
      # Geist Mono, for the kōan theme: the site's own file, read by Core Text as it is.
      - path: ../../site/public/geist-mono.woff2
        buildPhase: resources
    dependencies:
      - target: KoanFFITV
      - target: KoanTVTopShelf
    settings:
      base:
        PRODUCT_NAME: koan
        # One universal purchase with the iPhone app.
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "3"
        # A layered icon and the Top Shelf banners, drawn by
        # `apps/ios/tv-brand.swift`.
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        # No global accent: the shared catalog's green tints system alerts,
        # which a television draws as green text on a white focused button.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/tv-link/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lkoan_ffi
    # A background push is how the server reaches a TV tvOS has suspended,
    # to link and take what Play on sent it. tvOS shows no notifications, so
    # there is nothing more to ask for. `development` is the sandbox gateway a
    # development build's token belongs to; an App Store export, as
    # `ios-testflight` makes for the phone, rewrites it to `production`.
    entitlements:
      path: ../../target/ios-project/koan-tv.entitlements
      properties:
        aps-environment: development
        # App Attest, as the phone has it: the TV registers with the push
        # relay too.
        com.apple.developer.devicecheck.appattest-environment: development
        # Where the app leaves the Top Shelf's snapshot for the extension.
        com.apple.security.application-groups:
          - group.cc.blit.koan
    info:
      path: ../../target/ios-project/TV-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: cc.blit.koan
            CFBundleURLSchemes: [koan]
        # `remote-notification`: a background push wakes the app to link.
        UIBackgroundModes: [audio, remote-notification]
        NSLocalNetworkUsageDescription: >-
          koan connects to your music server when it is on your local network,
          and finds other koan apps on it to play music on.
        NSBonjourServices: [_koan._tcp]
        ITSAppUsesNonExemptEncryption: false

  # The Apple TV's Top Shelf: reads the snapshot the app writes to the app
  # group and links nothing of the engine. See `ContentProvider`.
  KoanTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: Sources/KoanTV/TopShelfSnapshot.swift
    settings:
      base:
        PRODUCT_NAME: KoanTVTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.topshelf
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "3"
    entitlements:
      path: ../../target/ios-project/KoanTVTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cc.blit.koan
    info:
      path: ../../target/ios-project/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store Connect refuses a tvOS extension with a 64-bit slice that
        # does not name arm64 here.
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider

  # Draws the Live Activity; the intents its buttons run are the app's.
  KoanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/KoanIOS/RemoteActivity.swift
    settings:
      base:
        PRODUCT_NAME: KoanWidgets
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.widgets
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
        # Nothing here imports the engine.
        OTHER_SWIFT_FLAGS: -package-name koan
        SWIFT_INCLUDE_PATHS: ""
    info:
      path: ../../target/ios-project/Widgets-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Attaches the album cover to a notification before it is shown.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.NotificationService
        # App Store Connect refuses an extension whose version differs from
        # its app's.
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ../../target/ios-project/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # Takes EQ and filter files, or text, shared from another app and leaves
  # them in the app group for the app to import. See `ShareViewController`.
  KoanShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
    settings:
      base:
        PRODUCT_NAME: KoanShare
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.share
        MARKETING_VERSION: ${KOAN_VERSION}
        CURRENT_PROJECT_VERSION: ${KOAN_BUILD}
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_SWIFT_FLAGS: -package-name koan
        SWIFT_INCLUDE_PATHS: ""
    entitlements:
      path: ../../target/ios-project/KoanShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cc.blit.koan
    info:
      path: ../../target/ios-project/KoanShare-Info.plist
      properties:
        CFBundleDisplayName: kōan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 10

  KoanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Koan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.uitests
        GENERATE_INFOPLIST_FILE: YES

  # The remote's walk through the television app. See `just tv-walk`.
  KoanTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: TVUITests
      # The case-blind lookup the iPhone's UI tests use too.
      - path: UITests/Labelled.swift
    dependencies:
      - target: KoanTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.blit.koan.tvuitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Koan:
    build:
      targets:
        Koan: all
    test:
      targets:
        - KoanUITests
    archive:
      config: Release
  KoanTV:
    build:
      targets:
        KoanTV: all
    test:
      targets:
        - KoanTVUITests
    archive:
      config: Release
