# The App Store listing for the iOS and tvOS apps, pushed by `just ios-store`
# and promoted to App Review by the `store.yml` workflow. `[tv]` overrides the
# fields that differ on the Apple TV; everything else is shared.
#
# Apple's limits are in the comments. What is left out is left out on purpose:
# third-party service names stay out of the keywords (guideline 2.3.7), and
# nothing here describes fetching music, only playing a library the user has.

locale = "en-GB"

[app]
name = "kōan music"                        # 30
subtitle = "Player for your music server"  # 30
primary_category = "MUSIC"
privacy_policy_url = "https://koan.rocks/privacy.html"

[version]
copyright = "2026 James Cleveland"
support_url = "https://github.com/radiosilence/koan/issues"
marketing_url = "https://koan.rocks"

# 100, comma-separated, no spaces needed after commas.
keywords = "music player,library,gapless,flac,lossless,self-hosted,server,offline,albums,queue,hifi,eq,dlna"

# 170. Can be changed without a new version.
promotional_text = """
A fast, native player for the music library on your own server. Gapless, lossless where the file is, and a queue \
that does what you tell it.\
"""

# 4000.
description = """
kōan plays the music library you already have, from a Subsonic-compatible server such as Navidrome or a kōan server. \
It is built for large collections, which browse and search as quickly as small ones.

YOUR LIBRARY, PROPERLY
Albums, artists and tracks as your tags describe them, with full-size artwork. Artist pages group records into \
albums, EPs and singles, live recordings and compilations, and a reissue sits at the year it first came out. Search \
covers the whole library at once, and sorting and filtering happen as you type.

A QUEUE THAT BEHAVES
Albums stay grouped in the queue. Add, reorder and remove as you like; what is playing is never interrupted by an edit. \
Playback is gapless, so live albums and continuous mixes play as recorded.

SOUND
kōan decodes FLAC, ALAC, WAV, AIFF, MP3, AAC, Opus and Vorbis with its own engine, the same one as the kōan Mac app. \
ReplayGain is applied from your tags, by track or by album.

EQ FOR YOUR HEADPHONES
Parametric EQ and convolution, set for each output and imported from the files headphone measurement sites publish. \
An output with no EQ plays the file untouched.

PLAY ON YOUR OTHER DEVICES
Signed in to a kōan server, the phone controls kōan on your Mac, Apple TV or another phone, and moves what is playing \
between them, with a Live Activity on the lock screen. It also plays through UPnP and DLNA amplifiers on your network.

OFFLINE AND ON THE MOVE
Tracks are cached on the phone as you play them, within a limit you set, so what you listen to often plays without a \
connection. Playback continues in the background and from the lock screen.

IN SYNC WITH THE SERVER
Favourites, playlists and play history are kept in step with your server, so the phone, the Mac app and the web agree.

PRIVATE
kōan has no account of its own, no analytics and no advertising. It talks to your server, and to public music \
databases for artist information and lyrics.

kōan is open source under the MIT licence. You need a Subsonic-compatible music server with your own music on it; \
kōan does not provide music.\
"""

[review]
first_name = "James"
last_name = "Cleveland"
email = "jc@blit.cc"
# The phone number App Review requires is not kept here: `ios-store` reads it
# from APPLE_REVIEW_PHONE, in international format.
demo_required = true
demo_user = "demo"
demo_password = "demo"
notes = """
kōan is a music player for people who keep their own collection on a Subsonic-compatible server they run, such as \
Navidrome or a kōan server. It is the iOS version of the open-source kōan Mac app \
(https://github.com/radiosilence/koan). It provides no music itself, has no in-app purchases and no user-generated \
content, and works the same in every region. It operates in no regulated industry.

To review it with a library, sign in to kōan's public demonstration server, which holds only Creative Commons and \
public-domain music and resets every hour:

1. Open the Settings tab (at the bottom on iPhone, in the bar across the top on iPad) and choose Server.
2. Server: https://demo.koan.rocks
   Username: demo
   Password: demo
3. Tap Sign In. The library syncs in a few seconds.
4. Browse from the Library tab; tap an album to play it. The queue is on the Queue tab.

Background audio: kōan is a music player, and the audio background mode keeps music playing when the app is in the \
background or the screen is locked. A recording on a physical device, playing from the demo server and then going to \
the Home Screen and the lock screen while the music continues, is attached to this submission.

Accounts: kōan has no registration and no account of its own. The user signs in with an account their server issued. \
An administrator signed in to a kōan server sees that server's accounts in Settings, with Add, Invite and Delete; the \
demo account is not an administrator and does not show this section.

Third-party material: kōan plays only what the user has on their own server. The demonstration server is operated by \
the developer and holds only music whose licence permits redistribution.

External services: the user's own music server (library, streams, artwork, favourites, playlists); MusicBrainz, \
Wikidata, Wikipedia and Wikimedia Commons (artist biographies and photos); LRCLIB (lyrics); Apple Push Notification \
service, through kōan's push relay (kōan servers only); the local network (Bonjour to find other kōan devices, SSDP \
to find UPnP amplifiers). No analytics, advertising, payments or AI services.

After signing in to a kōan server, the app asks to send notifications. They are used only when the user asks their \
own server to play music on this phone, for instance through an assistant: the server wakes the app to start it, or \
shows a notification to tap if iOS will not start it in the background.\
"""

[tv.version]
description = """
kōan plays the music library you already have, from a Subsonic-compatible server such as Navidrome or a kōan server, \
through your television and the speakers attached to it.

SIGN IN WITHOUT TYPING
With kōan on a phone or Mac on the same network, the TV finds your server on its own and shows a code. Scan it with \
your phone to sign the TV in. A password or API key can be entered instead.

YOUR LIBRARY ON THE BIG SCREEN
Albums, artists, playlists, favourites and history, with full-size artwork. Artist pages group records into albums, \
EPs and singles, live recordings and compilations. Filter and sort the album grid, or search the whole library from \
the remote.

PLAY TO IT FROM ANYWHERE
kōan on your phone or Mac can send music to the TV and control it from the sofa, and wake the TV to do it. The TV \
also plays from your server on its own. Hold the Siri button and ask for a record by name.

SOUND
Gapless playback, so live albums and continuous mixes play as recorded. FLAC, ALAC, WAV, AIFF, MP3, AAC, Opus and \
Vorbis are decoded by kōan's own engine, with ReplayGain from your tags.

PRIVATE
kōan has no account of its own, no analytics and no advertising. It talks to your server, and to public music \
databases for artist information and lyrics.

kōan is open source under the MIT licence. You need a Subsonic-compatible music server with your own music on it; \
kōan does not provide music.\
"""

