# Every version the Android build uses, pinned. Move them together: AGP bounds
# the Gradle and Kotlin it works with, and the Compose BOM bounds compileSdk.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coroutines = "1.10.2"
composeBom = "2026.06.01"
media3 = "1.10.1"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
coreKtx = "1.17.0"
jna = "5.18.1"
# Navigation 3: the back stack is a plain list the app owns.
navigation3 = "1.0.0"
# Coil 3 draws the artwork; its fetcher asks the engine for the bytes.
coil = "3.3.0"
junit = "4.13.2"
# The JVM half of rustls-platform-verifier. Not on Maven Central: the crate
# ships it in its own `maven` directory (see settings.gradle.kts), at the
# version of the `rustls-platform-verifier-android` crate in Cargo.lock.
rustlsPlatformVerifier = "0.1.1"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
rustls-platform-verifier = { module = "rustls:rustls-platform-verifier", version.ref = "rustlsPlatformVerifier" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
