{#- A credential just made, shown this once with a copy button. -#}
<div id="{{ result }}"><p class="mt-3 mb-0">Copy the {{ what }} now: it is not shown again.</p>
<div class="{{ crate::ui::pages::COPY_ROW }}"><input id="{{ result }}-value" readonly value="{{ secret }}" aria-label="New {{ what }}" class="{{ crate::ui::pages::COPY_INPUT }}">
<button data-on:click="navigator.clipboard.writeText(document.getElementById('{{ result }}-value').value)">Copy</button></div></div>
