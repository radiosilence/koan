{#- What the current scan is doing, or the last did. On a page as it loads it asks to be followed; a stream's own patches never do, or each would open another stream. -#}
<div id="scan-status"{% if follow %} data-init="@get('/library/scan')"{% endif %}>
{%- if let Some((class, text)) = line %}<p class="{{ class }} text-control" role="status">{{ text }}</p>{% endif -%}
</div>
