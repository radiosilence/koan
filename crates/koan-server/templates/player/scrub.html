{#- Position and length around the seek bar. `extra` places it; `height` is the slider's hit area, which the transport bar has no room to make 44 px. -#}
<div class="flex w-full items-center gap-2.5 text-fine text-muted tabular-nums {{ extra }}"><span data-np="pos">0:00</span>
<input type="range" class="{{ height }} min-w-0 flex-1" data-ctl="seek" min="0" max="0" step="0.1" value="0" aria-label="Position">
<span data-np="len">0:00</span></div>
