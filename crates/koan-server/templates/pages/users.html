<h1>Users</h1><p class="{{ crate::ui::pages::SUB }}">Everyone who can sign in to this server. An invite is a link that sets koan up with the account in one tap.</p>
{%- if let Some(list) = list %}
<form class="{{ crate::ui::users::FORM }}" data-on:submit__prevent="@post('/users')">
<input class="flex-1" name="username" data-bind:newuser placeholder="Username" maxlength="64" required autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Username">
<select class="px-2 py-1.5" data-bind:newrole aria-label="Access">
{%- for (role, label) in crate::ui::users::ROLES %}<option value="{{ role.as_str() }}"{% if loop.first %} selected{% endif %}>{{ label }}</option>{% endfor -%}
</select>
<button class="primary">Create and invite</button></form>
<div id="user-result"></div>{{ list }}
{%- else %}
<p class="{{ crate::ui::pages::EMPTY }}">This server runs without sign-in, so it has no accounts.</p>
{%- endif %}
