{#- Without script the form is an ordinary GET; with it, results follow typing. -#}
<h1>Search</h1><form class="search" action="/search" method="get" data-on:submit__prevent="@get('/search/results')">
<input class="w-full max-w-panel px-3 py-2.5 text-input" type="search" name="q" value="{{ q }}" placeholder="Albums, artists, tracks" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" autofocus aria-label="Search" data-bind:q data-init="$q && @get('/search/results')" data-on:input__debounce.250ms="history.replaceState(null, '', $q.trim() ? '/search?q=' + encodeURIComponent($q.trim()) : '/search'); @get('/search/results')"></form>{{ results|safe }}
