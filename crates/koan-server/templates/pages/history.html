{#- Picked plays collect in `$forget`, read off the boxes ticked whenever one changes; the bar to forget them shows once there is one. -#}
<div data-signals:forget="[]" data-on:change="$forget = [...el.querySelectorAll('#history input:checked')].map(i => i.value)">
<div class="flex flex-wrap items-baseline justify-between gap-2">
<h1>History</h1><div class="flex items-center gap-2" data-show="$forget.length > 0">
<span class="text-meta text-muted" data-text="$forget.length + ' selected'"></span>
<button data-on:click="el.closest('.page').querySelectorAll('#history input:checked').forEach(i => i.checked = false); $forget = []">Deselect</button>
<button class="bad" data-act-forget data-indicator:_forgetting data-attr:disabled="$_forgetting" data-on:click="@post('/history/forget?page={{ page }}')">Forget</button></div></div>
<div id="history-result"></div>{{ list }}</div>
