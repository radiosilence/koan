{#- The transport bar. The player's script fills what plays from the rows it was given, and marks the play button pressed while music plays. -#}
<footer class="fixed inset-x-0 bottom-(--tabs-h) z-5 grid h-[calc(var(--bar-h)+env(safe-area-inset-bottom))] grid-cols-[minmax(0,1fr)_minmax(0,2fr)_minmax(0,1fr)] items-center gap-4 border-t border-rule bg-bg px-4 pb-[env(safe-area-inset-bottom)] max-wide:bottom-[calc(var(--tabs-h)+env(safe-area-inset-bottom))] max-wide:h-(--bar-h) max-wide:grid-cols-[minmax(0,1fr)_auto] max-wide:gap-2 max-wide:pr-2 max-wide:pb-0 max-wide:pl-3">
<progress class="absolute inset-x-0 -top-px hidden h-0.5 w-full appearance-none border-0 bg-rule max-wide:block [&::-moz-progress-bar]:bg-brand [&::-webkit-progress-bar]:bg-rule [&::-webkit-progress-value]:bg-brand" data-np="progress" max="1" value="0"></progress>
<div class="flex min-w-0 items-center gap-2.5" data-kit-in-place>
<a class="flex-none hover:no-underline" href="{{ crate::ui::paths::queue() }}" tabindex="-1" aria-hidden="true"><img class="size-10 bg-surface object-cover" data-np="cover" alt="" hidden></a>
<span class="flex min-w-0 flex-col items-start">
<a class="max-w-full truncate text-meta text-strong hover:no-underline" href="{{ crate::ui::paths::queue() }}" data-np="title">Nothing playing</a>
<span class="credit max-w-full truncate text-fine text-muted" data-np="artist"></span></span></div>
<div class="flex min-w-0 flex-col items-center gap-1">{{ crate::ui::parts::Transport::bar() }}{{ crate::ui::parts::Scrub::bar() }}</div></footer>
