{#- The form asking for an account's new password. -#}
<form class="{{ crate::ui::users::FORM }}" data-on:submit__prevent="@post('/users/{{ id }}/password')">
<input class="flex-1" type="password" data-bind:setpassword placeholder="New password for {{ name }}" minlength="8" required autocomplete="new-password" aria-label="New password for {{ name }}">
<button class="primary">Set password</button></form>
<p class="{{ crate::ui::pages::SUB }}">Signs {{ name }} out of every device. <button class="quiet" data-on:click="@post('/users/{{ id }}/invite?reset=true')">Generate one and invite</button></p>
