{#- The form asking for an account's new password. -#}
{%- let form = self.form() %}
<form {{ form.attrs() }} class="mb-2 flex max-w-form gap-2">{{ self.field() }}{{ form.submit(kit::Button::standard("Set password")) }}</form>
<p class="mt-0 mb-3.5 text-muted">Signs {{ name }} out of every device. {{ self.generate() }}</p>
