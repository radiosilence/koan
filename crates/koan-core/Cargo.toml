[package]
name = "koan-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for koan — bit-perfect music player. Audio engine, player, database, format strings."
keywords = ["audio", "music", "player"]
categories = ["multimedia::audio"]

[dependencies]
# Acoustic analysis
bliss-audio = { version = "0.13", default-features = false, features = ["symphonia-all"] }
# Auth
argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
pem = "4"
ring = "0.17"
crossbeam-channel = "0.5"
chrono = "0.4"
# Config
dirs = "6"
figment = { version = "0.10", features = ["toml", "env"] }
# Credentials (cross-platform: macOS Keychain, Linux secret-service)
# Metadata
lofty = "0.25"
unicode-normalization = "0.1"
log = "0.4"
# Subsonic/Navidrome
getrandom = "0.4"
md5 = "0.8"
# Async/threading
parking_lot = "0.12"
# Only `sync`: `watch` is the analyser telling its subscribers a frame is
# ready. No runtime, no reactor — koan-core stays threads and channels.
tokio = { version = "1", default-features = false, features = ["sync"] }
rayon = "1"
reqwest = { workspace = true }
realfft = "3"
rtrb = "0.4"
# Database
rusqlite = { workspace = true, features = ["collation", "functions"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opus decoding (Symphonia can demux but not decode Opus)
opus-decoder = "0.1"
# Audio
symphonia = { version = "0.6", default-features = false, features = [
    "flac", "mp3", "aac", "vorbis", "alac", "pcm", "adpcm", "isomp4", "ogg", "mkv", "caf", "wav", "aiff", "opt-simd",
    "all-meta",
] }
# Utilities
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
toml = "1.1"
toml_edit = "0.25"
walkdir = { workspace = true }
# Watches the library folders so files added while koan is open are indexed
# without being asked. Default features so each platform gets its own backend
# (FSEvents on macOS, inotify on Linux).
notify = "8"

[target.'cfg(unix)'.dependencies]
# statvfs, for the free-space check before an organize run
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.18"

[dev-dependencies]
env_logger = "0.11"
serde_json = "1"
tempfile = "3"
