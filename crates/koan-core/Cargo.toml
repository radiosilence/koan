[package]
name = "koan-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for koan — bit-perfect music player. Audio engine, player, database, format strings."
keywords = ["audio", "music", "player"]
categories = ["multimedia::audio"]

[features]
default = ["native"]
# What a browser lacks: SQLite, sockets, blocking HTTP, TLS, the filesystem
# watcher, the sign-in crypto. Without it koan-core is the decode pipeline
# (`audio::buffer`, DSP, ReplayGain) and configuration, which build for
# `wasm32-unknown-unknown`.
native = [
    "dep:argon2",
    "dep:koan-relay-client",
    "dep:jsonwebtoken",
    "dep:pem",
    "dep:ring",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:notify",
    "dep:tungstenite",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:socket2",
]

[dependencies]
# Acoustic analysis
# Auth
argon2 = { version = "0.6", optional = true }
base64 = "0.23"
koan-relay-client = { workspace = true, optional = true }
hex = "0.4"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"], optional = true }
pem = { version = "4", optional = true }
ring = { version = "0.17", optional = true }
subtle = "2"
crossbeam-channel = "0.5"
chrono = "0.4"
# Config
dirs = "7"
figment = { version = "0.10", features = ["toml", "env"] }
# Credentials (cross-platform: macOS Keychain, Linux secret-service)
# Metadata
lofty = "0.25"
# Format strings, shared with sift's importer. Published as `sift-music`.
sift = { package = "sift-music", version = "0.10", default-features = false }
unicode-normalization = "0.1"
log = "0.4"
# Subsonic/Navidrome
getrandom = "0.4"
md5 = "0.8"
num-bigint = "0.5"
url = "2"
# Async/threading
nucleo = "0.5"
parking_lot = "0.13"
# Only `sync`: `watch` is the analyser telling its subscribers a frame is
# ready. No runtime, no reactor — koan-core stays threads and channels.
tokio = { version = "1", default-features = false, features = ["sync"] }
rayon = "1"
reqwest = { workspace = true, optional = true }
realfft = "3"
ebur128 = "0.1"
rtrb = "0.4"
# Database
rusqlite = { workspace = true, features = ["collation", "functions"], optional = true }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content hashes of the EQ files synced through a kōan server
sha2 = "0.11"
# Opus decoding (Symphonia can demux but not decode Opus)
opus-rs = "0.1.40"
# Audio
symphonia = { version = "0.6", default-features = false, features = [
    "flac", "mp3", "aac", "vorbis", "alac", "pcm", "adpcm", "isomp4", "ogg", "mkv", "caf", "wav", "aiff", "opt-simd",
    "all-meta",
] }
# The ALAC magic cookie, which carries the bit depth Symphonia's MP4 demuxer drops.
symphonia-common = { version = "0.6", default-features = false }
# Utilities
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
toml = "1.1"
toml_edit = "0.25"
walkdir = { workspace = true }
# Watches the library folders so files added while koan is open are indexed
# without being asked. Default features so each platform gets its own backend
# (FSEvents on macOS, inotify on Linux).
notify = { version = "8", optional = true }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
# The GraphQL subscription socket verifies certificates as reqwest does, against
# the platform's roots, so a server behind a private CA answers both.
rustls = { version = "0.23", default-features = false, optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
biquad = "0.6"
fft-convolver = "0.4"
rubato = "5"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
# UPnP renderers: device descriptions, SOAP and DIDL-Lite are XML.
quick-xml = "0.42.0"
# SSDP announcements arrive on port 1900, which other processes hold too:
# sharing it takes SO_REUSEADDR/SO_REUSEPORT before the bind.
socket2 = { version = "0.6.5", features = ["all"], optional = true }
# Renderers declare the charset of what they send; decoded as reqwest's
# `text()` would.
encoding_rs = "0.8.44"
flacenc = "0.5"

[target.'cfg(unix)'.dependencies]
# statvfs, for the free-space check before an organize run
libc = "0.2"

# tvOS declares what it uses in `audio/toolbox.rs`: the bindings' build script
# does not know the platform.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
coreaudio-sys = "0.2"
core-foundation = "0.10"

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
# The device id, kept in the Keychain so a reinstall keeps it
security-framework = "3"

[target.'cfg(target_os = "tvos")'.dependencies]
# The configuration, mirrored into the app's preferences: see `config::kept`
core-foundation = "0.10"
core-foundation-sys = "0.8"

# A browser's clock and randomness: `QueueItemId` is a UUIDv7.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.18"

[dev-dependencies]
env_logger = "0.11"
schemars = "1.2"
serde_json = "1"
tempfile = "3"
