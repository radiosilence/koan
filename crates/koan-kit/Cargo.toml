[package]
name = "koan-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kōan's design system for GPUI: the theme and its components. Knows nothing of the engine."
publish = false

[features]
profiler = ["gpui-kit/profiler"]
# GPUI's Metal shaders compiled when the app starts rather than when it is
# built: a build then needs the Command Line Tools, not Xcode's Metal
# toolchain. For development; releases compile them ahead, as by default.
runtime-shaders = ["dep:gpui_platform", "gpui_platform/runtime_shaders"]
test-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = "0.8.1"
# Named only for `runtime-shaders`: gpui-kit reaches it already.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", optional = true }
# The wash's bake and the accent's sampling, in the version GPUI builds
# against; PNG for the storybook's offscreen render.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
futures = "0.3"
parking_lot = "0.13"
smallvec = "1"
# A text field's word and character boundaries.
unicode-segmentation = "1.13"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
serde_json = "1"

# Reduce Motion, Increase Contrast, Reduce Transparency and Low Power Mode,
# which GPUI does not read, and the notifications that say when one changes.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSNotification",
  "NSOperation",
  "NSProcessInfo",
  "NSString",
  "block2",
] }

# High contrast and the text scaling factor, read through the desktop
# portal's settings as GPUI reads the colour scheme, with their change
# signals.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
