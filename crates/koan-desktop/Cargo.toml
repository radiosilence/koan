[package]
name = "koan-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kōan's desktop app for macOS and Linux, drawn with GPUI over koan-ffi."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "koan-desktop"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
gpui-kit = "0.8.1"
koan-core = { workspace = true }
koan-ffi = { path = "../koan-ffi" }
log = "0.4"
souvlaki = "0.9"

[dev-dependencies]
tempfile = "3"
