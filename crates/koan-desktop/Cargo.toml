[package]
name = "koan-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kōan's desktop app, drawn with GPUI."
publish = false

[[bin]]
name = "koan-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.1"
# Resizing sleeves for the accent and the wash, and the frames GPUI draws,
# in the version GPUI itself builds against; PNG for the theme sheet's
# offscreen render.
image = { version = "0.25.1", default-features = false, features = ["png"] }
parking_lot = "0.13"
smallvec = "1"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }

# Reduce Motion and Low Power Mode, which GPUI does not read.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo"] }
