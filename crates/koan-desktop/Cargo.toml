[package]
name = "koan-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kōan's desktop app for macOS, Linux and Windows, drawn with GPUI."
publish = false

[[bin]]
name = "koan-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.1"
# Decoding sleeves for the accent and the wash, and the frames GPUI draws;
# the version GPUI itself builds against.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.13"
smallvec = "1"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
