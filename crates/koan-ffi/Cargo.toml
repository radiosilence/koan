[package]
name = "koan-ffi"
version.workspace = true
edition.workspace = true
# uniffi's bindgen pulls cargo-platform, which requires 1.91. Unpublished and
# macOS-app-only, so it is exempt from the workspace MSRV the crates promise.
rust-version = "1.91"
license.workspace = true
repository.workspace = true
description = "uniffi bindings for koan-core — drives native GUI clients in-process."
keywords = ["audio", "music", "ffi", "uniffi"]
categories = ["multimedia::audio"]
publish = false

[lib]
name = "koan_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# Config is written back from the settings window.
toml = "1.1"
koan-core = { path = "../koan-core" }
crossbeam-channel = "0.5"
getrandom = "0.4"
log = "0.4"
nucleo = "0.5"
parking_lot = "0.12"
rusqlite = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
uniffi = "0.32"
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
# Invite links as QR codes, on Android, which has no encoder of its own.
qrcode = { version = "0.14.1", default-features = false }

# The app's Context, handed to reqwest's certificate verification: see
# `android.rs`.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
