[package]
name = "koan-ffi"
version.workspace = true
edition.workspace = true
# uniffi's bindgen pulls cargo-platform, which requires 1.91. Unpublished and
# macOS-app-only, so it is exempt from the workspace MSRV the crates promise.
rust-version = "1.91"
license.workspace = true
repository.workspace = true
description = "uniffi bindings for koan-core — drives native GUI clients in-process."
keywords = ["audio", "music", "ffi", "uniffi"]
categories = ["multimedia::audio"]
publish = false

[lib]
name = "koan_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Config is written back from the settings window.
toml = "1.1"
koan-core = { path = "../koan-core" }
crossbeam-channel = "0.5"
getrandom = "0.4"
log = "0.4"
nucleo = "0.5"
parking_lot = "0.12"
rusqlite = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
uniffi = { version = "0.32", features = ["cli"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
