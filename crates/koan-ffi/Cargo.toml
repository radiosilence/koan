[package]
name = "koan-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "uniffi bindings for kōan's engine (koan-runtime), for the Swift and Kotlin apps."
keywords = ["audio", "music", "ffi", "uniffi"]
categories = ["multimedia::audio"]
publish = false

# A Rust library only: the desktop app links it as one, and Cargo builds every
# crate type a dependency lists. The native apps ask for theirs as they build
# it, `staticlib` for the Apple apps (`just macos-ffi`, `ios-ffi`, `tv-ffi`)
# and `cdylib` for Android (Gradle's `koanFfi`), with `cargo rustc
# --crate-type`.

[lib]
name = "koan_ffi"

[dependencies]
koan-runtime = { path = "../koan-runtime" }
log = "0.4"
uniffi = "0.32"

# The app's Context, handed to reqwest's certificate verification: see
# `android.rs`.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
