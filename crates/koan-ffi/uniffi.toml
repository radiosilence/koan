# Kotlin only. A `KoanError` variant's field is called `message`, which
# clashes with `Throwable.message` in the generated `KoanException`, so the
# bindings do not compile. The Swift and Rust names are unchanged.
[bindings.kotlin.rename]
"KoanError.Database.message" = "detail"
"KoanError.Audio.message" = "detail"
"KoanError.Player.message" = "detail"
"KoanError.NotFound.message" = "detail"
"KoanError.BadArgument.message" = "detail"
"KoanError.Remote.message" = "detail"
"KoanError.NeedsSampleRate.message" = "detail"
