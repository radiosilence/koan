<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- The icon a build outside a bundle sets at launch. AppKit draws that
       image as it is, so it carries Apple's macOS icon grid itself: the tile
       824 of 1024 pixels, centred, with the template's shadow in the margin,
       the size the Dock gives a bundled app's icon. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image x="50" y="50" width="412" height="412" xlink:href="AppIcon.svg" filter="url(#shadow)"/>
</svg>
