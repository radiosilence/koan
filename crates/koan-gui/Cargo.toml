[package]
name = "koan-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kōan's desktop app for macOS and Linux, drawn with GPUI."
publish = false

[[bin]]
name = "koan-gui"
path = "src/main.rs"

[dependencies]
# The engine, linked as a Rust library: the same facade the Swift and Kotlin
# apps drive through uniffi, without the bindings.
koan-ffi = { path = "../koan-ffi" }
gpui-kit = "0.8.1"
log = "0.4"
# Waiting on the first of two events at startup (`select`, `oneshot`).
futures = "0.3"
