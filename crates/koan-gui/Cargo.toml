[package]
name = "koan-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The kōan GUI app, drawn with GPUI."
publish = false

[[bin]]
name = "koan-gui"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.1"
koan-ffi = { path = "../koan-ffi" }
# The platform cache directory for artwork.
dirs = "7"
# Channels from the artwork lanes to the main thread, and blocking on the
# engine's runtime-agnostic futures inside them.
futures = "0.3"
# Decoding and resizing sleeves for the library, the accent and the wash, and
# the frames GPUI draws, in the version GPUI itself builds against; PNG for
# the theme sheet's offscreen render.
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
parking_lot = "0.13"
# The browsers' sorts and filters, kept in gui-state.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
# The large test library's tags (examples/gen_library.rs).
lofty = "0.25"

# Reduce Motion and Low Power Mode, which GPUI does not read, and the
# notifications that say when either changes.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSNotification",
  "NSOperation",
  "NSProcessInfo",
  "NSString",
  "block2",
] }
