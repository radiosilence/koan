[package]
name = "koan-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The kōan GUI app, drawn with GPUI over koan-ffi: macOS and Linux for now."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "koan-gui"
path = "src/main.rs"

[features]
# GPUI's frame histograms, and `measure`, which scrolls the queue and prints
# them (`KOAN_GUI_MEASURE=scroll`).
profiler = ["koan-kit/profiler"]
# GPUI's Metal shaders compiled at startup, so a development build needs no
# Xcode: see koan-kit's feature. The dev recipes turn it on; releases do not.
runtime-shaders = ["koan-kit/runtime-shaders"]

[dependencies]
# The engine, linked as a Rust library: the same facade the Swift and Kotlin
# apps drive through uniffi, without the bindings.
koan-ffi = { path = "../koan-ffi" }
chrono = "0.4"
futures-channel = "0.3"
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The design system, and GPUI through it.
koan-kit = { path = "../koan-kit" }
# Only so the code GPUI's macros write, which names `gpui::`, resolves:
# gpui-kit's own advice is to alias it as `gpui`. Pages reach GPUI through
# `koan_kit::raw`, and `just gui-theme-leaks` forbids `gpui::` in source.
gpui = { package = "gpui-kit", version = "0.8.1" }
# The platform cache directory for artwork.
dirs = "7"
# Decoding and resizing sleeves for the library, the accent and the wash, and
# the frames GPUI draws, in the version GPUI itself builds against; PNG for
# the theme sheet's offscreen render; JPEG, WebP and GIF for sleeves.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
koan-core = { workspace = true }
log = "0.4"
# Waiting on the first of two events at startup (`select`, `oneshot`),
# channels from the artwork lanes, and blocking on the engine's
# runtime-agnostic futures inside them.
futures = "0.3"
parking_lot = "0.13"
# The browsers' sorts and filters, kept in gui-state.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
souvlaki = "0.9"

[dev-dependencies]
koan-kit = { path = "../koan-kit", features = ["test-support"] }
# The scroll benches (benches/album_grid.rs): GPUI's own harness, drawing
# through the headless Metal renderer with nothing on screen.
criterion = "0.8"
# Switches on GPUI's bench and test support, which the benches reach
# through gpui-kit's re-export as `gpui::`.
gpui_pre = { package = "gpui-pre", version = "=0.3.10", features = ["test-support", "bench-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["bench-support"] }
# The large test library's tags (examples/gen_library.rs).
lofty = "0.25"
tempfile = "3"

[[bench]]
name = "album_grid"
harness = false

# Reduce Motion and Low Power Mode, which GPUI does not read, and the
# notifications that say when either changes.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSNotification",
  "NSOperation",
  "NSProcessInfo",
  "NSString",
  "block2",
] }
