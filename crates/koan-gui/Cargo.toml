[package]
name = "koan-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The kōan GUI app, drawn with GPUI over koan-runtime: macOS and Linux for now."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "koan-gui"
path = "src/main.rs"

[features]
# GPUI's frame histograms, and `measure`, which scrolls the queue and prints
# them (`KOAN_GUI_MEASURE=scroll`).
profiler = ["koan-kit/profiler"]
# GPUI's Metal shaders compiled at startup, so a development build needs no
# Xcode: see koan-kit's feature. The dev recipes turn it on; releases do not.
runtime-shaders = ["koan-kit/runtime-shaders"]

[dependencies]
# Ctrl-C and SIGTERM from a terminal quit as ⌘Q does, saving what quitting saves.
ctrlc = { version = "3", features = ["termination"] }
# The engine, linked as a Rust library: the same facade the Swift and Kotlin
# apps drive through uniffi, without the bindings.
koan-runtime = { path = "../koan-runtime" }
chrono = "0.4"
futures-channel = "0.3"
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The design system, and GPUI through it.
koan-kit = { path = "../koan-kit" }
# Only so the code GPUI's macros write, which names `gpui::`, resolves.
# Pages reach GPUI through `koan_kit::raw`, and `just gui-theme-leaks`
# forbids `gpui::` in source.
gpui.workspace = true
# The platform cache directory for artwork.
dirs = "7"
# Decoding sleeves for the library's covers, and the playing record's,
# scaled down, for its accent and the wash, in the version GPUI itself builds against; PNG for the examples' offscreen
# renders; JPEG, WebP and GIF for sleeves.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
koan-core = { workspace = true }
log = "0.4"
# Waiting on the first of two events at startup (`select`, `oneshot`),
# channels from the artwork lanes, and blocking on the engine's
# runtime-agnostic futures inside them.
futures = "0.3"
parking_lot = "0.13"
# The browsers' sorts and filters, kept in gui-state.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
souvlaki = "0.9"

[dev-dependencies]
koan-kit = { path = "../koan-kit", features = ["test-support"] }
# The scroll benches (benches/album_grid.rs): GPUI's own harness, drawing
# through the headless Metal renderer with nothing on screen.
criterion = "0.8"
# Switches on GPUI's bench and test support, which the benches reach as
# `gpui::`.
gpui = { workspace = true, features = ["test-support", "bench-support"] }
gpui_platform = { workspace = true, features = ["bench-support"] }
# The large test library's tags (examples/gen_library.rs).
lofty = "0.25"
tempfile = "3"

[[bench]]
name = "album_grid"
harness = false

# The About panel, the menu bar's status item and whether the app shows in
# the Dock, which GPUI does not reach.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSStatusBar",
  "NSStatusItem",
] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSGeometry", "NSString"] }

# The audio session the engine plays through on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
  "std",
  "AVAudioSession",
  "AVAudioSessionTypes",
] }
# Its interruptions and route changes, heard as notifications.
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSDictionary",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSValue",
] }
