[package]
name = "koan-push-relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Forwards koan servers' pushes to Apple's push service under a key of its own, without letting them choose what a phone shows."
publish = false

[dependencies]
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.23"
env_logger = "0.11"
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
log = "0.4"
parking_lot = "0.12"
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["catch-panic", "limit", "timeout"] }

[dev-dependencies]
# The stub gateway in the tests speaks HTTP/2 without TLS, as the client
# always speaks HTTP/2 to Apple.
axum = { version = "0.8", features = ["http2"] }
tempfile = "3"
