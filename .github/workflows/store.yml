name: App Store

# Promotes a release to the App Store: pushes apps/ios/store/listing.toml,
# attaches the version's processed build and submits it to App Review. Run by
# hand once a release's TestFlight builds have processed; App Review is not
# something a merge should start on its own.
#
# Screenshots and the App Review attachment are pushed from a Mac with
# `just ios-store`, since they are made there and stay with the version record.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [both, ios, tvos]
        default: both
      version:
        description: Version (the workspace's when empty)
        type: string
        required: false
      submit:
        description: Submit to App Review
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  promote:
    name: Promote (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["ios","tvos"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Stage the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Push the listing
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          args=(--platform "$PLATFORM")
          [ -n "$VERSION" ] && args+=(--version "$VERSION")
          [ "$SUBMIT" = "true" ] && args+=(--submit)
          uv run apps/ios/store/push.py "${args[@]}"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
