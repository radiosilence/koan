name: container

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "Dockerfile", ".github/workflows/container.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "Dockerfile", ".github/workflows/container.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests build the image to prove it builds; main publishes it,
      # tagged with the commit it was built from. The workspace version is not
      # a tag: main moves between releases, and a deploy pins the commit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/radiosilence/koan:${{ github.sha }}
            ghcr.io/radiosilence/koan:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
