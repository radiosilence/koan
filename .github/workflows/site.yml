name: Site

# Builds the koan.rocks image and, on main, publishes it and asks the jaritanet deployment to pick it up. What version
# is deployed, and how the pin is moved, belong to jaritanet's updater; this only says a build exists.

permissions:
  contents: read
  packages: write

on:
  # Every push to main, not only site changes: the deployment deploys the image tagged with main's head, so every head
  # needs one. It's a copy of a few files, so building it costs next to nothing.
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

env:
  IMAGE: ghcr.io/radiosilence/koan-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A placeholder left in the pages would be published as-is. Text files only: an image's bytes can match.
      - name: No placeholders
        run: "! grep -rnI '__[A-Z]*__' site/public"

      # The stylesheet is compiled rather than committed, and the image serves public/ as it is, so it has to exist
      # before the build. The Tailwind CLI comes from site/mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          working_directory: site

      - name: Build the stylesheet
        working-directory: site
        run: mise run css

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures from one build: nothing in the image is architecture-specific.
      - name: Build and push
        env:
          PUSH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          if [ "$PUSH" = true ]; then
            docker buildx build site --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" --push
          else
            docker buildx build site --load --tag "$IMAGE:$TAG"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: site-deploy
      cancel-in-progress: true
    steps:
      # DEPLOYMENT_PAT needs `actions: write` on radiosilence/jaritanet; it triggers the updater, it doesn't commit.
      - name: Ask the deployment to pick this up
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DEPLOYMENT_PAT isn't set, so the deployment wasn't asked to update"
            exit 0
          fi
          gh workflow run update-apps.yml --repo radiosilence/jaritanet
