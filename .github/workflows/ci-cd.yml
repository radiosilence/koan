name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        # Only a change to something that feeds a build is worth two operating
        # systems and three toolchains. Prose, plans and the licence are not.
        #
        # An allowlist, so the question is "did any source change?" rather than
        # "was everything recognisably documentation?". The cost is that a new
        # top-level directory of code is invisible here until it is added below.
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            # HEAD is the merge commit GitHub built for this PR and its first
            # parent is the base branch, so this is exactly the PR's diff. If it
            # cannot be worked out, code stays true and everything runs.
            if files=$(git diff --name-only HEAD^1 HEAD); then
              src='^crates/|^apps/|^Cargo\.(toml|lock)$|^\.cargo/|^\.github/workflows/|^justfile$|^mise\.toml$|^rust-toolchain'
              # Steps run under `bash -e`, where grep finding nothing is a failing
              # command rather than an answer -- so the question is asked in a
              # condition, which is the form that survives it. Markdown is
              # documentation wherever it sits, including beside code.
              if ! printf '%s\n' "$files" | grep -E "$src" | grep -qvE '\.md$'; then
                code=false
                echo "no source changes -- skipping build, test and lint:"
              fi
              printf '%s\n' "$files" | sed 's/^/  /'
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    concurrency:
      group: fmt-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 45
    concurrency:
      group: clippy-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    # A matrix job skipped at job level reports one check named after the
    # unexpanded expression -- `Clippy (${{ matrix.os }})` -- so the per-OS
    # contexts the ruleset requires never appear and the pull request waits
    # on them forever. The job starts; its steps are what the filter stops.
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps (Linux)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - if: env.RUN == 'true'
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 45
    concurrency:
      group: test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    # A matrix job skipped at job level reports one check named after the
    # unexpanded expression -- `Test (${{ matrix.os }})` -- so the per-OS
    # contexts the ruleset requires never appear and the pull request waits
    # on them forever. The job starts; its steps are what the filter stops.
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps (Linux)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - if: env.RUN == 'true'
        run: cargo test --all-targets
      - if: env.RUN == 'true'
        run: cargo test --doc

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 45
    concurrency:
      group: build-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    # A matrix job skipped at job level reports one check named after the
    # unexpanded expression -- `Build (${{ matrix.os }})` -- so the per-OS
    # contexts the ruleset requires never appear and the pull request waits
    # on them forever. The job starts; its steps are what the filter stops.
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps (Linux)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - if: env.RUN == 'true'
        run: cargo build --release

  macos-app:
    name: macOS App
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    concurrency:
      group: macos-app-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: macos-app
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Builds koan-ffi, regenerates the Swift bindings from it, then compiles
      # the app. The bindings are generated, so this catches drift between the
      # Rust surface and the Swift that calls it.
      - run: just macos-build

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    concurrency:
      group: msrv-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: msrv
      # koan-ffi is excluded deliberately: it is unpublished, built only as part
      # of the macOS app, and uniffi's bindgen floors it at 1.91. The MSRV that
      # matters is the one the published crates promise.
      - run: cargo check --workspace --all-targets --exclude koan-ffi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    # Blocking. The advisories already in the lockfile are acknowledged in
    # .cargo/audit.toml so this fails on anything new.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, post-v2.0.0: node24 runtime
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check if release needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LATEST_VERSION=${LATEST_RELEASE#v}
          if [ -z "$LATEST_RELEASE" ] || [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          # Internal path deps carry a `version` for crates.io. If it drifts from
          # the workspace version, cargo publishes a crate pinned to a stale
          # sibling — path deps mask it locally and --no-verify masked it in CI.
          BAD=$(grep -hn 'koan-\(core\|server\|tui\) = ' crates/*/Cargo.toml Cargo.toml \
                | grep 'version' | grep -v "\"${CURRENT_VERSION}\"" || true)
          if [ -n "$BAD" ]; then
            echo "internal version pins out of sync with ${CURRENT_VERSION}:"
            echo "$BAD"
            exit 1
          fi

  create-release:
    name: Release (${{ matrix.binary_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: koan-macos-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: koan-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: koan-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary_name: koan-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/koan koan
          tar czf "${{ matrix.binary_name }}.tar.gz" koan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}.tar.gz

  create-macos-app:
    name: Release (kōan.app)
    runs-on: macos-latest
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: macos-app
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Both slices, lipo'd into one static library, so the app runs on Intel
      # and Apple silicon from a single download.
      - run: just macos-ffi "aarch64-apple-darwin x86_64-apple-darwin"
      - run: cd apps/macos && swift build -c release --arch arm64 --arch x86_64
      # Bundle, check, then package. `macos-verify` inspects the assembled
      # kōan.app, so it has to come after something that assembles one —
      # `macos-dmg` does that itself via `macos-bundle`, which put the check
      # before the thing it checks.
      - run: just macos-bundle
      - run: just macos-verify arm64 x86_64
      - run: just macos-dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-macos-app
          path: apps/macos/.build/pkg/Koan.dmg

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, clippy, test, build, macos-app, create-release, create-macos-app, check-version, publish-crate]
    if: ${{ !cancelled() && !failure() && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          # Prepended to the generated notes. Every direct download of the app
          # hits Gatekeeper, and the dialog it shows offers only "Move to Trash"
          # — so the way out belongs where people are already standing.
          body: |
            ## Install

            ```bash
            brew install radiosilence/koan/koan            # the CLI and TUI
            brew install --cask radiosilence/koan/koan-app # the macOS app
            ```

            ### Opening `Koan.dmg` directly

            The app is signed but not notarised, so macOS refuses it on first
            open with "Apple could not verify koan is free of malware" and
            offers only **Move to Trash**. Drag it to Applications, then:

            ```bash
            xattr -dr com.apple.quarantine /Applications/kōan.app
            ```

            It opens normally from then on. The Homebrew cask does this for you.
            Notarising properly needs a paid Apple Developer account, which this
            project does not have.

            ---
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, clippy, test, build, create-release, check-version]
    if: ${{ !cancelled() && !failure() && needs.check-version.outputs.should_release == 'true' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Publish crates
        # `cargo publish --workspace` resolves dependency order itself and waits
        # for each crate to appear in the index before publishing its dependents.
        # The verification build is what catches an internal version pin that no
        # longer resolves, so it must not be skipped.
        #
        # Publishing is not idempotent — it errors on a version that already
        # exists — and this job gates the GitHub release. So a re-run after a
        # *downstream* failure would fail here and take the release with it,
        # which is exactly what happened when the universal DMG failed to link.
        # koan-cli publishes last, so its presence means the whole set went out.
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if curl -sf https://index.crates.io/ko/an/koan-cli \
             | grep -q "\"vers\":\"${VERSION}\""; then
            echo "koan-cli ${VERSION} is already on crates.io — nothing to publish"
            exit 0
          fi
          cargo publish --workspace

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [publish-release, check-version]
    if: ${{ !cancelled() && !failure() && needs.check-version.outputs.should_release == 'true' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Update tap formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "RELEASE_TOKEN not set, skipping"
            exit 0
          fi
          VERSION="${{ needs.check-version.outputs.version }}"
          # Locate rather than assume, and stop if anything is missing.
          #
          # These were bare `sha256sum <path>` calls whose failure went nowhere:
          # the DMG landed at a path this did not expect, sha256sum wrote its
          # error to stderr, and the cask was published with `sha256 ""` — which
          # Homebrew cannot install and nothing in the run flagged.
          # Absolute, because this script later cds into the cloned tap. The
          # tarball shas were taken before that cd and the DMG's after it, so
          # only the DMG resolved to nothing — which is exactly the checksum
          # that went out empty.
          ARTIFACTS="$PWD/artifacts"
          shasum_of() {
            local file
            file=$(find "$ARTIFACTS" -type f -name "$1" | head -1)
            if [ -z "$file" ]; then
              echo "release artifact $1 not found under $ARTIFACTS" >&2
              find "$ARTIFACTS" -type f | sed 's/^/  /' >&2
              exit 1
            fi
            sha256sum "$file" | awk '{print $1}'
          }
          ARM_SHA=$(shasum_of koan-macos-arm64.tar.gz)
          INTEL_SHA=$(shasum_of koan-macos-x86_64.tar.gz)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-koan.git" /tmp/tap
          cd /tmp/tap
          cat > Formula/koan.rb <<FORMULA
          class Koan < Formula
            desc "Bit-perfect music player with TUI, gapless playback, and Subsonic support"
            homepage "https://github.com/radiosilence/koan"
            version "${VERSION}"
            license "MIT"
            on_arm do
              url "https://github.com/radiosilence/koan/releases/download/v#{version}/koan-macos-arm64.tar.gz"
              sha256 "${ARM_SHA}"
            end
            on_intel do
              url "https://github.com/radiosilence/koan/releases/download/v#{version}/koan-macos-x86_64.tar.gz"
              sha256 "${INTEL_SHA}"
            end
            def install
              bin.install "koan"
            end
            test do
              assert_match "koan", shell_output("#{bin}/koan --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/koan.rb
          # The GUI ships as a cask beside the CLI formula. Named koan-app so
          # `brew install koan` stays unambiguously the command-line player.
          DMG_SHA=$(shasum_of Koan.dmg)
          mkdir -p Casks
          cat > Casks/koan-app.rb <<CASK
          cask "koan-app" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/radiosilence/koan/releases/download/v#{version}/Koan.dmg"
            name "koan"
            desc "Bit-perfect music player"
            homepage "https://github.com/radiosilence/koan"

            depends_on macos: :tahoe

            app "kōan.app"

            # Ad-hoc signed, not notarised — without this Gatekeeper quarantines it.
            postflight do
              system_command "/usr/bin/xattr", args: ["-cr", "#{appdir}/kōan.app"]
            end

            zap trash: "~/.config/koan"
          end
          CASK
          sed -i 's/^          //' Casks/koan-app.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update koan to v${VERSION}"
          git push
