name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: fmt-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: clippy-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --all-targets
      - run: cargo test --doc

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: build-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo build --release

  macos-app:
    name: macOS App
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: macos-app-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: macos-app
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # Builds koan-ffi, regenerates the Swift bindings from it, then compiles
      # the app. The bindings are generated, so this catches drift between the
      # Rust surface and the Swift that calls it.
      - run: just macos-build

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: msrv-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv
      # koan-ffi is excluded deliberately: it is unpublished, built only as part
      # of the macOS app, and uniffi's bindgen floors it at 1.91. The MSRV that
      # matters is the one the published crates promise.
      - run: cargo check --workspace --all-targets --exclude koan-ffi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking. The advisories already in the lockfile are acknowledged in
    # .cargo/audit.toml so this fails on anything new.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Check if release needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LATEST_VERSION=${LATEST_RELEASE#v}
          if [ -z "$LATEST_RELEASE" ] || [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          # Internal path deps carry a `version` for crates.io. If it drifts from
          # the workspace version, cargo publishes a crate pinned to a stale
          # sibling — path deps mask it locally and --no-verify masked it in CI.
          BAD=$(grep -hn 'koan-\(core\|server\|tui\) = ' crates/*/Cargo.toml Cargo.toml \
                | grep 'version' | grep -v "\"${CURRENT_VERSION}\"" || true)
          if [ -n "$BAD" ]; then
            echo "internal version pins out of sync with ${CURRENT_VERSION}:"
            echo "$BAD"
            exit 1
          fi

  create-release:
    name: Release (${{ matrix.binary_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: koan-macos-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: koan-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: koan-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary_name: koan-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/koan koan
          tar czf "${{ matrix.binary_name }}.tar.gz" koan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}.tar.gz

  create-macos-app:
    name: Release (Koan.app)
    runs-on: macos-latest
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: macos-app
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # Both slices, lipo'd into one static library, so the app runs on Intel
      # and Apple silicon from a single download.
      - run: just macos-ffi "aarch64-apple-darwin x86_64-apple-darwin"
      - run: cd apps/macos && swift build -c release --arch arm64 --arch x86_64
      - run: just macos-dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-macos-app
          path: apps/macos/.build/pkg/Koan.dmg

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, clippy, test, build, macos-app, create-release, create-macos-app, check-version, publish-crate]
    if: ${{ !cancelled() && !failure() && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, clippy, test, build, create-release, check-version]
    if: ${{ !cancelled() && !failure() && needs.check-version.outputs.should_release == 'true' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Publish crates
        # `cargo publish --workspace` resolves dependency order itself and waits
        # for each crate to appear in the index before publishing its dependents.
        # The verification build is what catches an internal version pin that no
        # longer resolves, so it must not be skipped.
        #
        # Publishing is not idempotent — it errors on a version that already
        # exists — and this job gates the GitHub release. So a re-run after a
        # *downstream* failure would fail here and take the release with it,
        # which is exactly what happened when the universal DMG failed to link.
        # koan-cli publishes last, so its presence means the whole set went out.
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if curl -sf https://index.crates.io/ko/an/koan-cli \
             | grep -q "\"vers\":\"${VERSION}\""; then
            echo "koan-cli ${VERSION} is already on crates.io — nothing to publish"
            exit 0
          fi
          cargo publish --workspace

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [publish-release, check-version]
    if: ${{ !cancelled() && !failure() && needs.check-version.outputs.should_release == 'true' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Update tap formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "RELEASE_TOKEN not set, skipping"
            exit 0
          fi
          VERSION="${{ needs.check-version.outputs.version }}"
          ARM_SHA=$(sha256sum artifacts/koan-macos-arm64/koan-macos-arm64.tar.gz | awk '{print $1}')
          INTEL_SHA=$(sha256sum artifacts/koan-macos-x86_64/koan-macos-x86_64.tar.gz | awk '{print $1}')
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-koan.git" /tmp/tap
          cd /tmp/tap
          cat > Formula/koan.rb <<FORMULA
          class Koan < Formula
            desc "Bit-perfect music player with TUI, gapless playback, and Subsonic support"
            homepage "https://github.com/radiosilence/koan"
            version "${VERSION}"
            license "MIT"
            on_arm do
              url "https://github.com/radiosilence/koan/releases/download/v#{version}/koan-macos-arm64.tar.gz"
              sha256 "${ARM_SHA}"
            end
            on_intel do
              url "https://github.com/radiosilence/koan/releases/download/v#{version}/koan-macos-x86_64.tar.gz"
              sha256 "${INTEL_SHA}"
            end
            def install
              bin.install "koan"
            end
            test do
              assert_match "koan", shell_output("#{bin}/koan --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/koan.rb
          # The GUI ships as a cask beside the CLI formula. Named koan-app so
          # `brew install koan` stays unambiguously the command-line player.
          DMG_SHA=$(sha256sum artifacts/koan-macos-app/Koan.dmg | awk '{print $1}')
          mkdir -p Casks
          cat > Casks/koan-app.rb <<CASK
          cask "koan-app" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/radiosilence/koan/releases/download/v#{version}/Koan.dmg"
            name "koan"
            desc "Bit-perfect music player for macOS"
            homepage "https://github.com/radiosilence/koan"

            depends_on macos: ">= :sonoma"

            app "Koan.app"

            # Ad-hoc signed, not notarised — without this Gatekeeper quarantines it.
            postflight do
              system_command "/usr/bin/xattr", args: ["-cr", "#{appdir}/Koan.app"]
            end

            zap trash: [
              "~/.config/koan",
            ]
          end
          CASK
          sed -i 's/^          //' Casks/koan-app.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update koan to v${VERSION}"
          git push
