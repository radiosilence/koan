name: CI/CD

# Two halves in one run, so the second can use what the first built.
#
# CI checks the change and ends in `Checks`, the one status the ruleset
# requires. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it. Jobs can therefore be added, renamed or skipped without touching branch
# protection.
#
# CD runs after `Checks` has passed on main. Every push uploads the apps for
# testers (TestFlight, Google Play's internal track); a push that changes the
# version also releases: binaries, the Mac app, crates, the image's version
# tags, the Pulumi package, the GitHub release and Homebrew. CD ships what CI
# built: the Linux binaries (`linux-build`), which are also what the image
# holds, and the Android APK and bundle. The one release build CI has no use
# for, the Mac app's, starts alongside the checks rather than after them;
# nothing is published until both have passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The macOS runners are few, so a run nobody will look at gives way to the
# next. A pull request's newer push cancels its older run; on main, a newer
# push cancels an older one that releases nothing. GitHub holds the newer run
# ("waiting for ... to complete") until the cancelled one has stopped, which
# takes as long as its slowest job takes to wind down.
#
# A run that may release is in a group of its own and is never cancelled,
# notarisation included, and nor is a manual run, which is how a failed
# release is retried. The group is chosen before any job runs, so it cannot
# ask `changes`. A push may release when its head commit is titled
# `release: ` (as `just release` names its pull request) or changes
# `Cargo.toml`, which `changes` compares with the commit before: the
# second catches a version bump merged under any other title, at the cost of
# also keeping a dependency change from being cancelled.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      deps: ${{ steps.filter.outputs.deps }}
      docker: ${{ steps.filter.outputs.docker }}
      package: ${{ steps.filter.outputs.package }}
      apple: ${{ steps.filter.outputs.apple }}
      apple_apps: ${{ steps.filter.outputs.apple_apps }}
      android: ${{ steps.filter.outputs.android }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # The domains a change touches, from its diff. A pull request's is
        # against its base. A push's is against the last commit on main whose
        # run passed, so a push whose run was cancelled by the next one still
        # reaches CD with it; without one in recent history, the commit
        # before. A manual run, or a diff that cannot be worked out, runs
        # everything.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?" rather than "was everything recognisably irrelevant?". The
        # cost is that a new top-level directory of code is invisible here
        # until it is added below. Markdown is documentation wherever it sits.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          rust=true web=true deps=true docker=true package=true apple=true apple_apps=true android=true release=false
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          # A pull request merged or closed as its run was created: the
          # cancelling workflow can look before this run is listed, and the
          # run would otherwise hold runners for a change that is already in.
          # Unanswered, it counts as open.
          state=OPEN
          if [ "$EVENT" = "pull_request" ]; then
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo OPEN)
          fi
          # Empty when it cannot be found: then everything runs, since a
          # narrower diff could leave a cancelled push's changes undelivered.
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ "$passed" = "$(git rev-parse HEAD)" ]; then
              base=HEAD^1
            elif [ -n "$passed" ] && git fetch -q --deepen=200 origin main && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
            else
              echo "::notice::no passed run on main within reach -- running everything"
            fi
          fi
          # Whether this run releases, the one answer every release job reads.
          # A pull request: a release PR (branch `release-*`, or a version
          # change), which runs everything. A push: it changes the version
          # and that version is not out yet; comparing with the latest release
          # alone let a push landing while a release ran release it again. A
          # manual run, which is how a failed release is retried: whatever
          # version is not out yet.
          version=$(version_of < Cargo.toml)
          bumped=false
          if [ "$(git show "${base:-HEAD^1}:Cargo.toml" 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-*) bumped=true ;; esac
              release=$bumped
              ;;
            *)
              # Only a 404 means the version is not out. Any other failure
              # stops the run: guessing either way releases twice or never.
              if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
                  if printf '%s' "$out" | grep -q 'HTTP 404'; then
                    release=true
                  else
                    echo "::error::cannot tell whether v$version is released: $out"
                    exit 1
                  fi
                fi
              fi
              ;;
          esac
          touches() { printf '%s\n' "$files" | grep -E "$1" | grep -qvE '\.md$'; }
          if [ "$state" != "OPEN" ]; then
            echo "pull request #$PR is no longer open -- skipping everything"
            rust=false web=false deps=false docker=false package=false apple=false apple_apps=false android=false release=false
          elif [ "$EVENT" != "workflow_dispatch" ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'
            # Shared build inputs -- the lockfile, the justfile, mise.toml --
            # count for an app only when the change reaches it. Unanswerable,
            # they count.
            inputs=$(python3 .github/scripts/native_inputs.py "$base" HEAD) || inputs=$'apple=true\nandroid=true'
            eval "$(printf '%s\n' "$inputs" | sed 's/^/inputs_/')"

            # Anything cargo compiles or that decides how.
            touches '^crates/|^tools/|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^justfile$|^mise\.toml$|^\.github/' || rust=false
            # The web UI's compiled stylesheets: its styles and everything
            # Tailwind reads class names from.
            touches '^crates/koan-server/|^site/src/theme\.css$|^mise\.toml$|^justfile$|^\.github/' || web=false
            touches '^deploy/|^\.github/' || package=false
            # The image is the Linux binaries in a runtime layer. The Rust
            # jobs already check the code, so a pull request builds them and
            # the image only when the recipe changed; main whenever what they
            # contain did, since CD ships them.
            if [ "$EVENT" = "pull_request" ] || [ "$rust" = false ]; then
              touches '^Dockerfile$|^\.github/' || docker=false
            fi
            if [ "$EVENT" = "pull_request" ]; then
              # A new advisory can land on any day; main audits every push.
              touches '^Cargo\.lock$|Cargo\.toml$|^\.cargo/|^\.github/' || deps=false
            fi

            # The macOS runners are few. A pull request holds one only when it
            # touches what the Linux jobs cannot see: the apps and the FFI they
            # link, Rust compiled for Apple platforms alone, or a shared input
            # that reaches them. A shared change that breaks only on macOS is
            # then caught on main, which runs the Apple job for any Rust.
            apple=false
            if [ "$release" = true ] || [ "$inputs_apple" = true ] \
              || touches '^apps/(macos|ios)/|^crates/koan-ffi/|^tools/uniffi-bindgen/|^\.cargo/|^rust-toolchain|^\.github/' \
              || touches '^crates/koan-core/src/audio/(coreaudio_backend|device|engine|ios_backend|toolbox)\.rs$'; then
              apple=true
            # A Rust source or manifest changed near code for an Apple target:
            # within twenty lines of a cfg naming one, before or after. The
            # whole file would be too much, since most of the workspace has a
            # macOS branch somewhere.
            elif git diff -U20 "$base" HEAD -- '*.rs' '*.toml' \
              | grep -E '^[ +-]' | grep -qE 'target_os = "(macos|ios|tvos)"|target_vendor = "apple"'; then
              apple=true
            fi
            # What the Apple apps contain, for CD: everything above, and the
            # core they link, which the Linux jobs check.
            apple_apps=$apple
            if touches '^crates/koan-core/|^Cargo\.toml$'; then
              apple_apps=true
            fi
            if [ "$EVENT" != "pull_request" ] && [ "$rust" = true ]; then
              apple=true
            fi

            # The Android app links koan-core through koan-ffi and nothing else
            # of the workspace, so the server, TUI and CLI cannot break it, nor
            # can the Apple apps or the site.
            android=false
            if [ "$release" = true ] || [ "$inputs_android" = true ] \
              || touches '^apps/android/|^crates/(koan-core|koan-ffi)/|^tools/|^Cargo\.toml$|^\.cargo/|^rust-toolchain|^\.github/'; then
              android=true
            fi
          fi
          {
            echo "rust=$rust"
            echo "web=$web"
            echo "deps=$deps"
            echo "docker=$docker"
            echo "package=$package"
            echo "apple=$apple"
            echo "apple_apps=$apple_apps"
            echo "android=$android"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  # GitHub has no priority among its runners, and the account's few macOS
  # ones are what a release waits on. A release cancels this repository's
  # pull request runs, which are re-run from their page or by the next push,
  # and main's earlier non-release runs, which a newer one supersedes. At the
  # start rather than in CD, so the release builds that start alongside the
  # checks find the runners free. A job of its own, so only it holds a token
  # that can cancel runs.
  make-room:
    name: Make room for the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true'
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        # Best effort: a run it cannot list or cancel only waits longer for a
        # runner. A push that changes Cargo.toml may release, as the
        # concurrency rule above has it, so it is left alone whatever its title.
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,headSha,displayTitle \
              --jq '.[] | select(.event == "pull_request" or (.event == "push" and .headBranch == "main" and (.displayTitle | startswith("release: ") | not))) | "\(.databaseId) \(.event) \(.headSha)"' || true
          done | sort -u | while read -r id event sha; do
            [ "$id" = "$SELF" ] && continue
            if [ "$event" = push ]; then
              files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.files[].filename' || echo Cargo.toml)
              printf '%s\n' "$files" | grep -qx Cargo.toml && continue
            fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  fmt:
    name: Format
    # Formatting is the same on every platform, and macOS runners are the
    # scarce ones: every macOS job here queues behind the others.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    # A newer push cancels a PR's checks, never main's: a release run's
    # publish jobs need these to finish.
    concurrency:
      group: fmt-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust cache: formatting compiles nothing, and the repository's
      # cache space is better spent on the jobs that do.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, a release
  # or the conversion, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # The web UI's stylesheets are compiled by Tailwind and committed, since the
  # server embeds them. A source edited without a rebuild would ship the old CSS.
  css:
    name: Stylesheets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: just github:tailwindlabs/tailwindcss
      - run: just css
      - name: Compiled stylesheets match their sources
        run: git diff --exit-code crates/koan-server/assets

  # Clippy and the tests on one runner, with one target directory and one
  # cache: they share build scripts and proc-macros, which separate jobs each
  # compiled. Each check runs however an earlier one went, so one push reports
  # every failure; none runs after a failed setup step. Always the whole
  # workspace, on pull requests as on main: a narrower set of packages unifies
  # features differently and would miss the cache main saves.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    concurrency:
      group: linux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux
          # A failing check would otherwise leave the cache unsaved.
          cache-on-failure: true
      - run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --all-targets
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --doc

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    concurrency:
      group: msrv-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      # koan-ffi and the bindings generator are excluded deliberately: they are
      # unpublished, built only for the apps, and uniffi floors them at 1.91.
      # The MSRV that matters is the one the published crates promise.
      - run: cargo check --workspace --all-targets --exclude koan-ffi --exclude uniffi-bindgen

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    timeout-minutes: 15
    # Blocking. The advisories already in the lockfile are acknowledged in
    # .cargo/audit.toml so this fails on anything new.
    #
    # The action reports through a GitHub check run, which is an API write, and
    # this repository hands workflows a read-only token by default. Without this
    # the job fails with "Resource not accessible by integration" *after* a
    # clean audit. `contents: read` is spelled out because naming any permission drops
    # the rest to none.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, post-v2.0.0: node24 runtime
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pulumi-package:
    name: Pulumi package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The Linux binaries, in release, once: the image is built from them and a
  # release attaches them. Built on the runners, each on its own
  # architecture, with the Rust cache, rather than inside Docker.
  linux-build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    timeout-minutes: 45
    concurrency:
      group: linux-build-${{ matrix.name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the image's runtime must have at least this glibc.
          - name: koan-linux-x86_64
            runner: ubuntu-24.04
          - name: koan-linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.name }}
      # The CLI alone: the workspace would also build koan-ffi, which no
      # binary here contains. Tarred, because an artifact does not keep the
      # executable bit; the tarball is the release's download as it stands.
      - run: |
          cargo build --release --locked -p koan-cli
          tar czf "${{ matrix.name }}.tar.gz" -C target/release koan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          retention-days: ${{ needs.changes.outputs.release == 'true' && 90 || 7 }}

  # The binaries above in a runtime image, for both architectures. A pull
  # request builds it to prove it builds. Main pushes it under the commit, in
  # parallel with the checks: nothing deploys a commit tag, and CD moves
  # `main`, and a release's version and `latest`, onto it only once `Checks`
  # has passed.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, linux-build]
    if: ${{ !cancelled() && needs.linux-build.result == 'success' }}
    concurrency:
      group: container-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/radiosilence/koan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: koan-linux-*
      - run: |
          mkdir -p dist/amd64 dist/arm64
          tar xzf koan-linux-x86_64/koan-linux-x86_64.tar.gz -C dist/amd64
          tar xzf koan-linux-arm64/koan-linux-arm64.tar.gz -C dist/arm64
      # The runtime layer's package installs run emulated for arm64. They
      # depend on nothing of koan's, so the registry cache keeps them.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record is uploaded as an artifact of this run, and the
          # release jobs download every artifact in it: that one fails their
          # digest check and takes the release with it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: dist
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # The layer cache lives beside the image in GHCR rather than in the
          # repository's Actions cache, which the Rust caches need. Written
          # from main only; anything else reads it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # Everything checked for Apple, on one runner: the account's macOS runners
  # are few, and every macOS job in every run queues behind the others.
  #
  # A pull request proves the engine builds and its tests pass on macOS and
  # that the app compiles against it, in the dev profile throughout, so the
  # FFI library, the tests and the app share one build of the dependencies.
  # Clippy and the full suite are the Linux job's; the code only macOS
  # compiles is linted on main. Main checks everything, tvOS included, and
  # saves the cache pull requests start from.
  #
  # A release push is not checked again: its pull request and main's previous
  # push were. The release builds belong to `macos-release`.
  apple:
    name: Apple
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.apple == 'true' && !(github.event_name != 'pull_request' && needs.changes.outputs.release == 'true')
    timeout-minutes: 90
    concurrency:
      group: apple-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    env:
      # Everything, tvOS included: main and manual runs.
      FULL: ${{ github.event_name != 'pull_request' }}
      # The FFI library's dependencies are built for this target, as the tests'
      # are, so neither invalidates the other's build scripts.
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ env.FULL == 'true' && 'aarch64-apple-tvos,aarch64-apple-tvos-sim' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: apple
          cache-on-failure: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: env.FULL == 'true'
        run: cargo clippy --all-targets -- -D warnings
      # Builds koan-ffi and regenerates the Swift bindings from it. The bindings
      # are generated, so the app build below catches drift between the Rust
      # surface and the Swift that calls it.
      - id: ffi
        if: ${{ !cancelled() }}
        run: just macos-ffi
        env:
          KOAN_FFI_PROFILE: debug
      # The tests, the app and the typechecks at once. Each needs only the
      # library and bindings above, and the tests spend much of their run
      # waiting, which the Swift compiler fills. Every log is printed, and
      # every failure named, once all have finished.
      - name: Tests, the app, and the iOS and tvOS typechecks
        if: ${{ !cancelled() && steps.ffi.outcome == 'success' }}
        run: |
          names=() pids=()
          start() {
            local name=$1; shift
            "$@" > "$RUNNER_TEMP/$name.log" 2>&1 &
            names+=("$name") pids+=($!)
          }
          # A pull request tests the crates with code for Apple platforms.
          # Main builds that same set first, so the cache it saves holds the
          # features a pull request's narrower build unifies to.
          if [ "$FULL" = true ]; then
            start tests bash -c 'cargo test -p koan-core -p koan-ffi --all-targets --no-run && cargo test --all-targets'
          else
            start tests cargo test -p koan-core -p koan-ffi --all-targets
          fi
          start app bash -c 'cd apps/macos && swift build -c debug'
          # The shared sources build for iOS and tvOS too. These need the
          # bindings and nothing else: no Rust build for either, no simulator.
          start ios-typecheck just --no-deps ios-typecheck
          if [ "$FULL" = true ]; then
            start tv-typecheck just --no-deps tv-typecheck
          fi
          failed=()
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "::group::${names[$i]} passed"
              cat "$RUNNER_TEMP/${names[$i]}.log"
              echo "::endgroup::"
            else
              failed+=("${names[$i]}")
              echo "${names[$i]} failed:"
              cat "$RUNNER_TEMP/${names[$i]}.log"
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi
      - if: ${{ !cancelled() && env.FULL == 'true' }}
        run: cargo test --doc
      - if: ${{ !cancelled() && env.FULL == 'true' }}
        run: brew install xcodegen
      # The device target as well as the simulator's: they take different
      # cfgs in places, and only the simulator is built below.
      - if: ${{ !cancelled() && env.FULL == 'true' }}
        run: cargo check -p koan-ffi --target aarch64-apple-tvos --target-dir target/tv-26.0
        env:
          TVOS_DEPLOYMENT_TARGET: "26.0"
      - if: ${{ !cancelled() && env.FULL == 'true' }}
        run: just tv-build

  # Tests, lints and builds the app as it ships. Off pull requests it also
  # builds the bundle Google Play takes; CD uploads that, and attaches the APK
  # to a release, rather than building either again.
  android:
    name: Android App
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    timeout-minutes: 60
    concurrency:
      group: android-app-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust, the JDK and cargo-ndk as mise.toml pins them, as a contributor's
      # terminal has them; cargo-ndk is built with mise's Rust.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: rust java cargo:cargo-ndk just
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: android-app
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The runner's SDK has neither the NDK the app pins nor its platform.
      - run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)"/\1/p' apps/android/app/build.gradle.kts)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "platforms;android-37.0" > /dev/null
      # Signed with the release key, so every CI build and every release is an
      # update to the last (Android installs an update only over a build signed
      # with the same key). A run without the secrets, as from a fork, signs
      # with a debug key of its own.
      - name: Release key
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE" ]; then
            echo "::notice::ANDROID_RELEASE_KEYSTORE is not set, so this APK is signed with a debug key of its own"
            exit 0
          fi
          keystore="$RUNNER_TEMP/koan-release.p12"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$keystore"
          {
            echo "KOAN_ANDROID_KEYSTORE=$keystore"
            echo "KOAN_ANDROID_KEYSTORE_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
      # One ABI: phones, and emulators on Apple silicon. The version code rises
      # with the time, as the iOS build number does, since Google Play takes
      # each only once; it fits Android's limit until 2036.
      - name: Test, lint and build
        working-directory: apps/android
        env:
          BUNDLE: ${{ github.event_name != 'pull_request' && ':app:bundleRelease' || '' }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease $BUNDLE -Pabis=arm64-v8a -PversionCode="$(date -u +%s)"
      - name: Name the APK
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "APK_NAME=koan-android-${SHA}" >> "$GITHUB_ENV"
          mv apps/android/app/build/outputs/apk/release/app-release.apk "koan-android-${SHA}.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          retention-days: 14
      # Not named koan-*: the release attaches every koan-* artifact.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-bundle
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

  # The one status the ruleset requires. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, fmt, changelog, css, linux, msrv, audit, pulumi-package, linux-build, container, apple, android]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $(echo $bad)"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`. `checks` runs whatever its needs did, so every
  # job here states the results it depends on rather than relying on the
  # default, which would skip it whenever any job upstream was skipped.

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
    outputs:
      should_release: ${{ needs.changes.outputs.release }}
      version: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version pins
        env:
          CURRENT_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          # Internal path deps carry a `version` for crates.io. If it drifts from
          # the workspace version, cargo publishes a crate pinned to a stale
          # sibling — path deps mask it locally and --no-verify masked it in CI.
          BAD=$(grep -hn 'koan-\(core\|server\|tui\) = ' crates/*/Cargo.toml Cargo.toml \
                | grep 'version' | grep -v "\"${CURRENT_VERSION}\"" || true)
          if [ -n "$BAD" ]; then
            echo "internal version pins out of sync with ${CURRENT_VERSION}:"
            echo "$BAD"
            exit 1
          fi
          # The package is published at the app's own version, so the two must
          # move together or it ships pointing at the wrong image.
          PKG_VERSION=$(node -p "require('./deploy/pulumi/package.json').version")
          PKG_APP_VERSION=$(sed -n 's/^export const APP_VERSION = "\(.*\)";/\1/p' deploy/pulumi/src/versions.ts)
          if [ "$PKG_VERSION" != "$CURRENT_VERSION" ] || [ "$PKG_APP_VERSION" != "$CURRENT_VERSION" ]; then
            echo "::error::deploy/pulumi out of sync with ${CURRENT_VERSION}: package.json $PKG_VERSION, versions.ts $PKG_APP_VERSION"
            exit 1
          fi

  # `main` follows the last commit whose checks passed. Retagging needs no
  # rebuild.
  container-main:
    name: Container image (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [container, check-version]
    if: ${{ !cancelled() && needs.container.result == 'success' && needs.check-version.result == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/radiosilence/koan
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release run is never cancelled and can finish after a later push's
      # run: `main` moves only while this commit is still main's head.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head; leaving the main tag"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:$GITHUB_SHA"

  # Every push that changes what the Apple apps contain uploads an iOS build,
  # a release or not: the workspace version stays and the build number (the
  # time) rises, so testers always have main. tvOS uploads with releases only.
  # Nothing waits on this. App Store Connect's processing of an upload takes
  # anywhere from minutes to an hour and says nothing about the release, so the
  # rest goes out without it. A failed upload is retried alone, from ios.yml's
  # manual dispatch.
  testflight:
    name: TestFlight
    needs: [changes, check-version]
    if: ${{ !cancelled() && needs.check-version.result == 'success' && (needs.changes.outputs.apple_apps == 'true' || needs.check-version.outputs.should_release == 'true') }}
    uses: ./.github/workflows/ios.yml
    with:
      platform: ${{ needs.check-version.outputs.should_release == 'true' && 'both' || 'ios' }}
    secrets: inherit

  # The bundle the Android job built, to Google Play's internal testing track,
  # on every push that changes what the app contains. Skipped, not failed,
  # until the service account's key is configured.
  play:
    name: Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [android, check-version]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.check-version.result == 'success' }}
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - id: signable
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping Google Play."
          fi
      - if: steps.signable.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: play-bundle
      # An app that has never been published takes only draft releases;
      # PLAY_RELEASE_STATUS=draft covers that until it is.
      - if: steps.signable.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cc.blit.koan
          releaseFiles: app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  # The macOS CLI and app in release, Developer ID signed (hardened runtime,
  # secure timestamp) here and notarised by `notarise` once the release is out:
  # Apple's queue is no part of releasing. A ticket for a bare binary is
  # fetched online, keyed on its code directory hash, so the tarball published
  # now is the one notarised later.
  #
  # Started by `changes` rather than after `Checks`: it is the longest job in a
  # release and publishes nothing, so it builds while the checks run, and the
  # publishing waits for both.
  macos-release:
    name: Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.make-room.result == 'success' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: apple-release
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Developer ID
        uses: ./.github/actions/developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - run: cargo build --release -p koan-cli
      - name: Package the CLI
        run: |
          cp target/release/koan koan
          codesign --force --options runtime --timestamp --sign "$KOAN_SIGN_IDENTITY" koan
          codesign --verify --strict --verbose=2 koan
          tar czf koan-macos-arm64.tar.gz koan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-macos-arm64
          path: koan-macos-arm64.tar.gz
      # Build, bundle and package in one invocation, so `macos-build` runs
      # once; then check the kōan.app the disk image was made from.
      - name: Package the app
        run: |
          just macos-dmg
          just macos-verify arm64
      - name: Sign the DMG
        run: codesign --force --timestamp --sign "$KOAN_SIGN_IDENTITY" apps/macos/.build/pkg/Koan.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-macos-app
          path: apps/macos/.build/pkg/Koan.dmg

  # The image this commit already pushed, tagged with the release's version
  # and `latest` once the release's builds have passed: a failed release must
  # not move `latest`. Retagging needs no rebuild, and repeats safely.
  container-release:
    name: Container image (release tags)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-version, container, macos-release]
    if: ${{ !cancelled() && needs.check-version.outputs.should_release == 'true' && needs.container.result == 'success' && needs.macos-release.result == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/radiosilence/koan
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:v$VERSION" -t "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Once the release's builds have passed: a version on crates.io cannot be
    # taken back, so it goes out only once the rest of the release can follow
    # it. Publishing is skipped when the version is already out (below), so a
    # re-run after a later failure passes straight through.
    needs: [check-version, linux-build, macos-release]
    if: ${{ !cancelled() && needs.check-version.outputs.should_release == 'true' && needs.linux-build.result == 'success' && needs.macos-release.result == 'success' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      # The verification build is a debug build of the published crates,
      # which `Linux` compiles on every push to main, so its
      # cache is read rather than one of this job's own, which only a release
      # would save and which eviction always took first. rust-cache hashes
      # CARGO_* variables into the key, so the registry token is set on the
      # publishing step alone, not the job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux
          save-if: false
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # `cargo publish --workspace` resolves dependency order itself and waits
        # for each crate to appear in the index before publishing its dependents.
        # The verification build is what catches an internal version pin that no
        # longer resolves, so it must not be skipped.
        #
        # Publishing is not idempotent: it errors on a version that already
        # exists. A release retried after a partial publish, or after a
        # downstream failure, would fail here and take the GitHub release with
        # it, so each crate already in the index at this version is excluded
        # and only the rest go out.
        run: |
          EXCLUDE=()
          PENDING=0
          for crate in $(cargo metadata --no-deps --format-version 1 \
                         | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" \
               | grep -q "\"vers\":\"${VERSION}\""; then
              echo "${crate} ${VERSION} is already on crates.io"
              EXCLUDE+=(--exclude "$crate")
            else
              PENDING=$((PENDING + 1))
            fi
          done
          if [ "$PENDING" -eq 0 ]; then
            echo "nothing to publish"
            exit 0
          fi
          cargo publish --workspace "${EXCLUDE[@]}"
      # `cargo publish` unpacks each crate under target/package, and the cache
      # step's clean-up of target trips over what it left there. The compiled
      # dependencies it caches live elsewhere in target.
      - if: always()
        run: rm -rf target/package

  publish-package:
    name: Publish Pulumi package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Before the release: the updater that deploys koan follows releases, and
    # a release it finds must already have its package. After the image's
    # version tag, which the package pins: a published package promises an
    # image that exists, and a package version cannot be reused.
    needs: [container-release]
    if: ${{ !cancelled() && needs.container-release.result == 'success' }}
    permissions:
      packages: write
      contents: read
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      # A version cannot be published twice, so a release retried after this
      # step passed finds it out and moves on. Only a 404 means it is not.
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if out=$(npm view "$spec" version 2>&1); then
            echo "$spec is already published"
            exit 0
          fi
          if ! printf '%s' "$out" | grep -q E404; then
            echo "::error::cannot tell whether $spec is published: $out"
            exit 1
          fi
          npm publish

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check-version, android, linux-build, macos-release, publish-crate, publish-package]
    # Every need having run, not merely not failed: a skipped job is not a
    # failure, and a release without one of its parts is not a release.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # What is shipped, not the builds it was packaged from.
          pattern: koan-*
      # Release writes go through RELEASE_TOKEN: GitHub answers the workflow
      # token's with "Resource not accessible by integration", contents: write
      # notwithstanding.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      # The Android job names its APK by commit, as a pull request's is found;
      # a release names it as the other platforms' downloads are named.
      - name: Name the APK
        run: |
          apk=$(find artifacts -name 'koan-android-*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::the Android job left no APK to release"
            exit 1
          fi
          mv "$apk" artifacts/koan-android-arm64.apk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # The action creates the tag through the API, on the commit that was
        # built: GitHub refuses a git push of it from the workflow token for any
        # commit that changes a workflow ("refusing to allow a GitHub App to
        # create or update workflow"). A re-run finds
        # the release and tag and fills in what is missing.
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          # Prepended to the generated notes.
          body: |
            ## Install

            ```bash
            brew install radiosilence/koan/koan            # the CLI and TUI
            brew install --cask radiosilence/koan/koan-app # the macOS app
            ```

            Android: install `koan-android-arm64.apk` below.

            ---
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/koan-android-arm64.apk

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [publish-release, check-version]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # What is shipped, not the builds it was packaged from.
          pattern: koan-*
      - name: Update tap formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # A release that leaves Homebrew on the old version has failed, so a
          # missing token fails the job rather than passing it green.
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the Homebrew tap cannot be updated"
            exit 1
          fi
          VERSION="${{ needs.check-version.outputs.version }}"
          # Locate rather than assume, and stop if anything is missing.
          #
          # A bare `sha256sum <path>` on a missing file only writes to stderr, and a
          # cask published with `sha256 ""` cannot be installed.
          # Absolute, because this script later cds into the cloned tap.
          ARTIFACTS="$PWD/artifacts"
          shasum_of() {
            local file
            file=$(find "$ARTIFACTS" -type f -name "$1" | head -1)
            if [ -z "$file" ]; then
              echo "release artifact $1 not found under $ARTIFACTS" >&2
              find "$ARTIFACTS" -type f | sed 's/^/  /' >&2
              exit 1
            fi
            sha256sum "$file" | awk '{print $1}'
          }
          ARM_SHA=$(shasum_of koan-macos-arm64.tar.gz)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-koan.git" /tmp/tap
          cd /tmp/tap
          cat > Formula/koan.rb <<FORMULA
          class Koan < Formula
            desc "Bit-perfect music player with TUI, gapless playback, and Subsonic support"
            homepage "https://github.com/radiosilence/koan"
            version "${VERSION}"
            license "MIT"
            url "https://github.com/radiosilence/koan/releases/download/v#{version}/koan-macos-arm64.tar.gz"
            sha256 "${ARM_SHA}"
            depends_on arch: :arm64
            def install
              bin.install "koan"
            end
            test do
              assert_match "koan", shell_output("#{bin}/koan --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/koan.rb
          # The cask follows the notarised DMG, from `notarise`.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update koan to v${VERSION}"
          git push

  # Apple's notary, apart from the release: everything else is out by the
  # time this starts, and its queue can take hours. It waits on Apple, staples
  # the DMG and replaces the release's copy with it, then moves the Homebrew
  # cask to it. Failing or timing out fails this job alone; re-running it
  # waits on the submissions already made (`scripts/notarise.sh`) rather than
  # submitting again.
  notarise:
    name: Notarise (macOS)
    runs-on: macos-latest
    timeout-minutes: 200
    needs: [publish-release, check-version]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: koan-macos-*
      - name: API key
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "::error::set the APPLE_API_KEY_* secrets"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # Each submission is named for what it holds, its version and the hash of
      # its contents, which is how a re-run finds it again.
      - name: Notarise the binaries
        run: |
          set -euo pipefail
          mkdir payload
          tar xzf artifacts/koan-macos-arm64/koan-macos-arm64.tar.gz -C payload
          hash=$(cat payload/* | shasum -a 256 | cut -c1-12)
          zip="$RUNNER_TEMP/koan-$VERSION-macos-$hash.zip"
          ditto -c -k --norsrc --noextattr payload "$zip"
          scripts/notarise.sh "$zip"
      - name: Notarise and staple the DMG
        run: |
          set -euo pipefail
          hash=$(shasum -a 256 artifacts/koan-macos-app/Koan.dmg | cut -c1-12)
          dmg="$RUNNER_TEMP/Koan-$VERSION-$hash.dmg"
          cp artifacts/koan-macos-app/Koan.dmg "$dmg"
          scripts/notarise.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mkdir stapled
          cp "$dmg" stapled/Koan.dmg
      - name: Replace the release's DMG
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release's DMG cannot be replaced"
            exit 1
          fi
          gh release upload "v$VERSION" stapled/Koan.dmg --clobber
      - name: Update the Homebrew cask
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the Homebrew cask cannot be updated"
            exit 1
          fi
          DMG_SHA=$(shasum -a 256 stapled/Koan.dmg | awk '{print $1}')
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-koan.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          # Named koan-app so `brew install koan` stays the command-line player.
          cat > Casks/koan-app.rb <<CASK
          cask "koan-app" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/radiosilence/koan/releases/download/v#{version}/Koan.dmg"
            name "koan"
            desc "Bit-perfect music player"
            homepage "https://github.com/radiosilence/koan"

            depends_on macos: :tahoe

            app "kōan.app"

            zap trash: "~/.config/koan"
          end
          CASK
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update koan-app to v${VERSION}"
          git push
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
