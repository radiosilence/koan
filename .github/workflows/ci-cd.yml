name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The macOS runners are few, so a run nobody will look at gives way to the
# next. A pull request's newer push cancels its older run; on main, a newer
# push cancels an older one that releases nothing. GitHub holds the newer run
# ("waiting for ... to complete") until the cancelled one has stopped, which
# takes as long as its slowest job takes to wind down.
#
# A run that may release is in a group of its own and is never cancelled,
# notarisation included, and nor is a manual run, which is how a failed
# release is retried. The group is chosen before any job runs, so it cannot
# ask `check-version`. A push may release when its head commit is titled
# `release: ` (as `just release` names its pull request) or changes
# `Cargo.toml`, which `check-version` compares with the commit before: the
# second catches a version bump merged under any other title, at the cost of
# also keeping a dependency change from being cancelled.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      package: ${{ steps.filter.outputs.package }}
      macos: ${{ steps.filter.outputs.macos }}
      android: ${{ steps.filter.outputs.android }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Only a change to something that feeds a build is worth two operating
        # systems and three toolchains. Prose, plans and the licence are not.
        #
        # An allowlist, so the question is "did any source change?" rather than
        # "was everything recognisably documentation?". The cost is that a new
        # top-level directory of code is invisible here until it is added below.
        run: |
          code=true
          docker=true
          package=true
          macos=true
          android=true
          release=false
          # A pull request merged or closed as its run was created: the
          # cancelling workflow can look before this run is listed, and the
          # run would otherwise hold runners for a change that is already in.
          # Unanswered, it counts as open.
          state=OPEN
          if [ "$EVENT" = "pull_request" ]; then
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo OPEN)
          fi
          if [ "$state" != "OPEN" ]; then
            echo "pull request #$PR is no longer open -- skipping everything"
            code=false docker=false package=false macos=false android=false
          elif [ "$EVENT" = "pull_request" ]; then
            # HEAD is the merge commit GitHub built for this PR and its first
            # parent is the base branch, so this is exactly the PR's diff. If it
            # cannot be worked out, code stays true and everything runs.
            if files=$(git diff --name-only HEAD^1 HEAD); then
              src='^crates/|^apps/|^Cargo\.(toml|lock)$|^\.cargo/|^\.github/workflows/|^justfile$|^mise\.toml$|^rust-toolchain|^site/src/theme\.css$'
              # Steps run under `bash -e`, where grep finding nothing is a failing
              # command rather than an answer -- so the question is asked in a
              # condition, which is the form that survives it. Markdown is
              # documentation wherever it sits, including beside code.
              if ! printf '%s\n' "$files" | grep -E "$src" | grep -qvE '\.md$'; then
                code=false
                echo "no source changes -- skipping build, test and lint:"
              fi
              # The Rust jobs already cover the code the image compiles, so a
              # pull request builds the image only when its recipe changed.
              if ! printf '%s\n' "$files" | grep -qE '^(Dockerfile|\.dockerignore)$'; then
                docker=false
              fi
              if ! printf '%s\n' "$files" | grep -qE '^deploy/'; then
                package=false
              fi
              # The macOS runners are few. A pull request holds one only when
              # it touches what the Linux jobs cannot see: the apps and the FFI
              # they link, or Rust that is compiled for Apple platforms alone.
              # A shared change that breaks only on macOS is then caught by the
              # release pull request, which runs everything.
              version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
              case "$HEAD_REF" in release-*) release=true ;; esac
              if [ "$(git show HEAD^1:Cargo.toml | version_of)" != "$(version_of < Cargo.toml)" ]; then
                release=true
              fi
              if [ "$release" = false ]; then
                macos=false
                # The apps, the FFI and its bindings generator; the recipes that
                # build them; dependencies and toolchains, whose Apple-only
                # crates the Linux jobs never compile; and the workflows, so a
                # change to this gating runs what it gates.
                native='^apps/|^crates/koan-ffi/|^tools/uniffi-bindgen/|^justfile$|^Cargo\.lock$|^\.cargo/|^rust-toolchain|^mise\.toml$|^\.github/workflows/'
                # Modules declared for Apple targets only, whose own source
                # names no target.
                native="$native"'|^crates/koan-core/src/audio/(coreaudio_backend|device|engine|ios_backend|toolbox)\.rs$'
                if printf '%s\n' "$files" | grep -E "$native" | grep -qvE '\.md$'; then
                  macos=true
                fi
                # Any other Rust source or manifest with code for an Apple
                # target, as it stands now or as it stood before (a deletion).
                apple='target_os = "(macos|ios|tvos)"|target_vendor = "apple"'
                for f in $(printf '%s\n' "$files" | grep -E '\.(rs|toml)$' || true); do
                  if { git show "HEAD:$f" 2>/dev/null; git show "HEAD^1:$f" 2>/dev/null; } | grep -qE "$apple"; then
                    macos=true
                    break
                  fi
                done
              fi
              # The Android app compiles all of koan-core, so any Rust change can
              # break it; a change confined to the Apple apps or the site cannot.
              if ! printf '%s\n' "$files" | grep -E '^apps/android/|^crates/|^tools/|^Cargo\.(toml|lock)$|^\.cargo/|^justfile$|^mise\.toml$|^rust-toolchain|^\.github/workflows/' | grep -qvE '\.md$'; then
                android=false
              fi
              echo "macOS jobs: $macos (release: $release)"
              echo "Android job: $android"
              printf '%s\n' "$files" | sed 's/^/  /'
            fi
          fi
          {
            echo "code=$code"
            echo "docker=$docker"
            echo "package=$package"
            echo "macos=$macos"
            echo "android=$android"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    # Formatting is the same on every platform, and macOS runners are the
    # scarce ones: every macOS job here queues behind the others.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    # A newer push cancels a PR's checks, never main's: a release run's
    # publish jobs need these to finish.
    concurrency:
      group: fmt-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust cache: formatting compiles nothing, and the repository's
      # cache space is better spent on the jobs that do.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, a release
  # or the conversion, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # The web UI's stylesheets are compiled by Tailwind and committed, since the
  # server embeds them. A source edited without a rebuild would ship the old CSS.
  css:
    name: Stylesheets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: just github:tailwindlabs/tailwindcss
      - run: just css
      - name: Compiled stylesheets match their sources
        run: git diff --exit-code crates/koan-server/assets

  # Clippy, the tests and the release build on one runner, with one target
  # directory and one cache: build scripts and proc-macros are compiled once
  # rather than per job, and the repository's cache space holds one entry
  # rather than three. Each check runs whatever an earlier one did, so one
  # push reports every failure; none runs after a failed setup step.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 90
    concurrency:
      group: linux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux
          # One failing check would otherwise leave all three profiles unsaved.
          cache-on-failure: true
      - run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --all-targets
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --doc
      - id: build
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo build --release
      # On main the binary goes on to the release jobs, which package this
      # build rather than compiling the same commit again. Manual runs upload
      # it too, since they are how a failed release is retried. Tarred,
      # because an artifact does not keep the executable bit.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: tar czf koan-build.tar.gz -C target/release koan
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-koan-x86_64-unknown-linux-gnu
          path: koan-build.tar.gz
          retention-days: 1

  # Everything built for Apple, on one runner: the account's macOS runners are
  # few, and every macOS job in every run queues behind the others. A pull
  # request checks; a release builds, signs and packages the CLI and the app,
  # which its pull request has already checked. Other pushes to main do not
  # run it. A pull request with nothing for it (see `changes`) runs it on Linux
  # with its steps skipped, so the check the ruleset requires still reports.
  apple:
    name: Apple
    runs-on: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    needs: [changes, check-version]
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.check-version.outputs.should_release == 'true') }}
    timeout-minutes: 90
    concurrency:
      group: apple-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    env:
      RUN: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true' }}
      RELEASE: ${{ needs.check-version.outputs.should_release == 'true' }}
      # Checking: everything but a release push, which its pull request checked.
      CHECK: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true' && needs.check-version.outputs.should_release != 'true' }}
      # A release pull request packages too, unsigned, so a packaging failure
      # shows before the version is merged rather than after.
      PACKAGE: ${{ needs.check-version.outputs.should_release == 'true' || needs.changes.outputs.release == 'true' }}
      # The tvOS build itself runs on release pull requests only. Every other
      # pull request typechecks the shared sources for tvOS, which catches an
      # API tvOS lacks, and a release uploads a tvOS build to TestFlight.
      TVOS: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ env.TVOS == 'true' && 'aarch64-apple-tvos,aarch64-apple-tvos-sim' || '' }}
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: apple
      - if: env.RUN == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo test --all-targets
      - if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo test --doc
      # Builds koan-ffi, regenerates the Swift bindings from it, then compiles
      # the app. The bindings are generated, so this catches drift between the
      # Rust surface and the Swift that calls it. When packaging, the app is
      # built through `macos-dmg` below instead, once.
      - if: ${{ !cancelled() && env.CHECK == 'true' && env.PACKAGE != 'true' }}
        run: just macos-build
      # The shared sources also build for iOS and tvOS. These need the same
      # bindings and nothing else: no Rust build for either, no simulator.
      - if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: just ios-typecheck
      - if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: just tv-typecheck
      - if: ${{ !cancelled() && env.CHECK == 'true' && env.TVOS == 'true' }}
        run: brew install xcodegen
      # The device target as well as the simulator's: they take different
      # cfgs in places, and only the simulator is built below.
      - if: ${{ !cancelled() && env.CHECK == 'true' && env.TVOS == 'true' }}
        run: cargo check -p koan-ffi --target aarch64-apple-tvos --target-dir target/tv-26.0
        env:
          TVOS_DEPLOYMENT_TARGET: "26.0"
      - if: ${{ !cancelled() && env.CHECK == 'true' && env.TVOS == 'true' }}
        run: just tv-build
      # Developer ID signed (hardened runtime, secure timestamp) here, and
      # notarised by `notarise` once the release is out: Apple's queue is no
      # part of releasing. A ticket for a bare binary is fetched online, keyed
      # on its code directory hash, so the tarball published now is the one
      # notarised later.
      - name: Developer ID
        if: env.RUN == 'true' && env.RELEASE == 'true'
        uses: ./.github/actions/developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - if: ${{ !cancelled() && env.RUN == 'true' && env.PACKAGE == 'true' }}
        run: cargo build --release -p koan-cli
      - name: Package the CLI
        if: env.RUN == 'true' && env.RELEASE == 'true'
        run: |
          cp target/release/koan koan
          codesign --force --options runtime --timestamp --sign "$KOAN_SIGN_IDENTITY" koan
          codesign --verify --strict --verbose=2 koan
          tar czf koan-macos-arm64.tar.gz koan
      - if: env.RUN == 'true' && env.RELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-macos-arm64
          path: koan-macos-arm64.tar.gz
      # Build, bundle and package in one invocation, so `macos-build` runs
      # once; then check the kōan.app the disk image was made from.
      - name: Package the app
        if: ${{ !cancelled() && env.RUN == 'true' && env.PACKAGE == 'true' }}
        run: |
          just macos-dmg
          just macos-verify arm64
      - name: Sign the DMG
        if: env.RUN == 'true' && env.RELEASE == 'true'
        run: codesign --force --timestamp --sign "$KOAN_SIGN_IDENTITY" apps/macos/.build/pkg/Koan.dmg
      - if: env.RUN == 'true' && env.RELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koan-macos-app
          path: apps/macos/.build/pkg/Koan.dmg

  android-app:
    name: Android App
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.changes.outputs.android == 'true' }}
    timeout-minutes: 60
    concurrency:
      group: android-app-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust, the JDK and cargo-ndk as mise.toml pins them, as a contributor's
      # terminal has them; cargo-ndk is built with mise's Rust.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: rust java cargo:cargo-ndk just
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: android-app
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The runner's SDK has neither the NDK the app pins nor its platform.
      - run: |
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)"/\1/p' apps/android/app/build.gradle.kts)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "platforms;android-37.0" > /dev/null
      # Signed with the release key, so every CI build and every release is an
      # update to the last (Android installs an update only over a build signed
      # with the same key). A run without the secrets, as from a fork, signs
      # with a debug key of its own.
      - name: Release key
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE" ]; then
            echo "::notice::ANDROID_RELEASE_KEYSTORE is not set, so this APK is signed with a debug key of its own"
            exit 0
          fi
          keystore="$RUNNER_TEMP/koan-release.p12"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$keystore"
          {
            echo "KOAN_ANDROID_KEYSTORE=$keystore"
            echo "KOAN_ANDROID_KEYSTORE_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
      # One ABI: phones, and emulators on Apple silicon.
      - name: Test, lint and build
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -Pabis=arm64-v8a
      - name: Name the APK
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "APK_NAME=koan-android-${SHA}" >> "$GITHUB_ENV"
          mv apps/android/app/build/outputs/apk/release/app-release.apk "koan-android-${SHA}.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          retention-days: 14

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    concurrency:
      group: msrv-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      # koan-ffi and the bindings generator are excluded deliberately: they are
      # unpublished, built only for the apps, and uniffi floors them at 1.91.
      # The MSRV that matters is the one the published crates promise.
      - run: cargo check --workspace --all-targets --exclude koan-ffi --exclude uniffi-bindgen

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    # Blocking. The advisories already in the lockfile are acknowledged in
    # .cargo/audit.toml so this fails on anything new.
    #
    # The action reports through a GitHub check run, which is an API write, and
    # this repository hands workflows a read-only token by default. Without this
    # the job fails with "Resource not accessible by integration" *after* a
    # clean audit. `contents: read` is spelled out because naming any permission drops
    # the rest to none.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, post-v2.0.0: node24 runtime
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, check-version, fmt, linux, audit]
    # check-version runs only on main, so it is skipped on pull requests and
    # this must not require it to have succeeded. The checks are skipped when
    # no code changed; an image is published only when none of them failed.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/radiosilence/koan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Anything but main builds the image to prove it builds. Main publishes it under
      # the commit and `main`, since a deploy pins the commit. A release's version
      # and `latest` are added by `container-release`, once the rest of the
      # release has passed.
      - id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_SHA"
            echo "$IMAGE:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record is uploaded as an artifact of this run, and the
          # release jobs download every artifact in it: that one fails their
          # digest check and takes the release with it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          # The layer cache lives beside the image in GHCR rather than in the
          # repository's Actions cache, whose 10 GB it otherwise fills, evicting
          # the Rust caches. Written from main only; anything else reads it.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  container-release:
    name: Container image (release tags)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The image this commit already pushed, tagged with the release's version
    # and `latest` only after every other job has passed: a failed release
    # must not move `latest`. Retagging needs no rebuild, and repeats safely.
    needs: [fmt, css, linux, msrv, audit, apple, create-release, container, check-version]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && needs.container.result == 'success' && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/radiosilence/koan
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:v$VERSION" -t "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"

  pulumi-package:
    name: Pulumi package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check if release needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        # A push releases only when it changes the version. Comparing with the
        # latest GitHub release alone let any push that landed while a release
        # was still running (the release appears at its end) release the same
        # version a second time. A manual run releases whatever is unreleased,
        # which is how a failed release is retried.
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          CURRENT_VERSION=$(version_of < Cargo.toml)
          PREVIOUS_VERSION=$(git show HEAD^:Cargo.toml 2>/dev/null | version_of || true)
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LATEST_VERSION=${LATEST_RELEASE#v}
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          # Internal path deps carry a `version` for crates.io. If it drifts from
          # the workspace version, cargo publishes a crate pinned to a stale
          # sibling — path deps mask it locally and --no-verify masked it in CI.
          BAD=$(grep -hn 'koan-\(core\|server\|tui\) = ' crates/*/Cargo.toml Cargo.toml \
                | grep 'version' | grep -v "\"${CURRENT_VERSION}\"" || true)
          if [ -n "$BAD" ]; then
            echo "internal version pins out of sync with ${CURRENT_VERSION}:"
            echo "$BAD"
            exit 1
          fi
          # The package is published at the app's own version, so the two must
          # move together or it ships pointing at the wrong image.
          PKG_VERSION=$(node -p "require('./deploy/pulumi/package.json').version")
          PKG_APP_VERSION=$(sed -n 's/^export const APP_VERSION = "\(.*\)";/\1/p' deploy/pulumi/src/versions.ts)
          if [ "$PKG_VERSION" != "$CURRENT_VERSION" ] || [ "$PKG_APP_VERSION" != "$CURRENT_VERSION" ]; then
            echo "::error::deploy/pulumi out of sync with ${CURRENT_VERSION}: package.json $PKG_VERSION, versions.ts $PKG_APP_VERSION"
            exit 1
          fi
      # GitHub has no priority among its runners, and the account's few macOS
      # ones are what a release waits on. A release cancels this repository's
      # pull request runs, which are re-run from their page or by the next
      # push, and main's earlier non-release runs, which a newer one supersedes.
      - name: Make room for the release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,displayTitle \
              --jq '.[] | select(.event == "pull_request" or (.event == "push" and .headBranch == "main" and (.displayTitle | startswith("release: ") | not))) | .databaseId'
          done | sort -u | while read -r id; do
            [ "$id" = "$SELF" ] && continue
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  create-release:
    name: Release (${{ matrix.binary_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # `linux` has already compiled the x86_64 binary, which is packaged from
    # its artifact; only arm64 is built here. `apple` packages the macOS CLI.
    needs: [check-version, linux]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: koan-linux-x86_64
            prebuilt: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary_name: koan-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.prebuilt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-koan-${{ matrix.target }}
      - if: matrix.prebuilt
        run: |
          mkdir -p target/${{ matrix.target }}/release
          tar xzf koan-build.tar.gz -C target/${{ matrix.target }}/release
      - name: Install system deps
        if: ${{ !matrix.prebuilt }}
        uses: ./.github/actions/linux-deps
      - if: ${{ !matrix.prebuilt }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: ${{ !matrix.prebuilt }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: release-${{ matrix.target }}
      # The CLI alone: the workspace would also build koan-ffi, which no
      # binary here contains.
      - if: ${{ !matrix.prebuilt }}
        run: cargo build --release --target ${{ matrix.target }} -p koan-cli
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/koan koan
          tar czf "${{ matrix.binary_name }}.tar.gz" koan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}.tar.gz

  # Every push to main that passes uploads an iOS build, a release or not: the
  # workspace version stays and the build number (the time) rises, so testers
  # always have main. tvOS uploads with releases only. Nothing waits on this.
  # App Store Connect's processing of an upload takes anywhere from minutes to
  # an hour and says nothing about the release, so the GitHub release, the
  # crates, the image tags and the package go out without it. A failed upload
  # is retried alone, from ios.yml's manual dispatch.
  testflight:
    name: TestFlight
    needs: [fmt, linux, audit, check-version]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/ios.yml
    with:
      platform: ${{ needs.check-version.outputs.should_release == 'true' && 'both' || 'ios' }}
    secrets: inherit

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, css, linux, msrv, audit, apple, android-app, create-release, container-release, check-version, publish-crate, publish-package]
    # The publishes having run, not merely not failed: they are skipped when
    # anything before them failed, and a skipped job is not a failure.
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && needs.create-release.result == 'success' && needs.publish-crate.result == 'success' && needs.publish-package.result == 'success' && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # What is shipped, not the builds it was packaged from.
          pattern: koan-*
      # Release writes go through RELEASE_TOKEN: GitHub answers the workflow
      # token's with "Resource not accessible by integration", contents: write
      # notwithstanding.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      # The Android job names its APK by commit, as a pull request's is found;
      # a release names it as the other platforms' downloads are named.
      - name: Name the APK
        run: |
          apk=$(find artifacts -name 'koan-android-*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::the Android job left no APK to release"
            exit 1
          fi
          mv "$apk" artifacts/koan-android-arm64.apk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # The action creates the tag through the API, on the commit that was
        # built: GitHub refuses a git push of it from the workflow token for any
        # commit that changes a workflow ("refusing to allow a GitHub App to
        # create or update workflow"). A re-run finds
        # the release and tag and fills in what is missing.
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          # Prepended to the generated notes.
          body: |
            ## Install

            ```bash
            brew install radiosilence/koan/koan            # the CLI and TUI
            brew install --cask radiosilence/koan/koan-app # the macOS app
            ```

            Android: install `koan-android-arm64.apk` below.

            ---
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/koan-android-arm64.apk

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # After every other job in the run has passed, the Mac app and TestFlight
    # included: a version on crates.io cannot be taken back, so it goes out
    # only once the rest of the release can follow it. Notarisation comes after the GitHub release and is
    # not waited for. Publishing is skipped when the version is already out
    # (below), so a re-run after a later failure passes straight through.
    needs: [fmt, css, linux, msrv, audit, apple, create-release, check-version]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && needs.check-version.outputs.should_release == 'true' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      # The verification build is a debug build of the published crates,
      # which `Linux` compiles on every push to main, so its
      # cache is read rather than one of this job's own, which only a release
      # would save and which eviction always took first. rust-cache hashes
      # CARGO_* variables into the key, so the registry token is set on the
      # publishing step alone, not the job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux
          save-if: false
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # `cargo publish --workspace` resolves dependency order itself and waits
        # for each crate to appear in the index before publishing its dependents.
        # The verification build is what catches an internal version pin that no
        # longer resolves, so it must not be skipped.
        #
        # Publishing is not idempotent: it errors on a version that already
        # exists. A release retried after a partial publish, or after a
        # downstream failure, would fail here and take the GitHub release with
        # it, so each crate already in the index at this version is excluded
        # and only the rest go out.
        run: |
          EXCLUDE=()
          PENDING=0
          for crate in $(cargo metadata --no-deps --format-version 1 \
                         | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" \
               | grep -q "\"vers\":\"${VERSION}\""; then
              echo "${crate} ${VERSION} is already on crates.io"
              EXCLUDE+=(--exclude "$crate")
            else
              PENDING=$((PENDING + 1))
            fi
          done
          if [ "$PENDING" -eq 0 ]; then
            echo "nothing to publish"
            exit 0
          fi
          cargo publish --workspace "${EXCLUDE[@]}"
      # `cargo publish` unpacks each crate under target/package, and the cache
      # step's clean-up of target trips over what it left there. The compiled
      # dependencies it caches live elsewhere in target.
      - if: always()
        run: rm -rf target/package

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [publish-release, check-version]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && needs.check-version.outputs.should_release == 'true' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # What is shipped, not the builds it was packaged from.
          pattern: koan-*
      - name: Update tap formula
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # A release that leaves Homebrew on the old version has failed, so a
          # missing token fails the job rather than passing it green.
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the Homebrew tap cannot be updated"
            exit 1
          fi
          VERSION="${{ needs.check-version.outputs.version }}"
          # Locate rather than assume, and stop if anything is missing.
          #
          # A bare `sha256sum <path>` on a missing file only writes to stderr, and a
          # cask published with `sha256 ""` cannot be installed.
          # Absolute, because this script later cds into the cloned tap.
          ARTIFACTS="$PWD/artifacts"
          shasum_of() {
            local file
            file=$(find "$ARTIFACTS" -type f -name "$1" | head -1)
            if [ -z "$file" ]; then
              echo "release artifact $1 not found under $ARTIFACTS" >&2
              find "$ARTIFACTS" -type f | sed 's/^/  /' >&2
              exit 1
            fi
            sha256sum "$file" | awk '{print $1}'
          }
          ARM_SHA=$(shasum_of koan-macos-arm64.tar.gz)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-koan.git" /tmp/tap
          cd /tmp/tap
          cat > Formula/koan.rb <<FORMULA
          class Koan < Formula
            desc "Bit-perfect music player with TUI, gapless playback, and Subsonic support"
            homepage "https://github.com/radiosilence/koan"
            version "${VERSION}"
            license "MIT"
            url "https://github.com/radiosilence/koan/releases/download/v#{version}/koan-macos-arm64.tar.gz"
            sha256 "${ARM_SHA}"
            depends_on arch: :arm64
            def install
              bin.install "koan"
            end
            test do
              assert_match "koan", shell_output("#{bin}/koan --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/koan.rb
          # The cask follows the notarised DMG, from `notarise`.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update koan to v${VERSION}"
          git push

  # Apple's notary, apart from the release: everything else is out by the
  # time this starts, and its queue can take hours. It waits on Apple, staples
  # the DMG and replaces the release's copy with it, then moves the Homebrew
  # cask to it. Failing or timing out fails this job alone; re-running it
  # waits on the submissions already made (`scripts/notarise.sh`) rather than
  # submitting again.
  notarise:
    name: Notarise (macOS)
    runs-on: macos-latest
    timeout-minutes: 200
    needs: [publish-release, check-version]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: koan-macos-*
      - name: API key
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "::error::set the APPLE_API_KEY_* secrets"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # Each submission is named for what it holds, its version and the hash of
      # its contents, which is how a re-run finds it again.
      - name: Notarise the binaries
        run: |
          set -euo pipefail
          mkdir payload
          tar xzf artifacts/koan-macos-arm64/koan-macos-arm64.tar.gz -C payload
          hash=$(cat payload/* | shasum -a 256 | cut -c1-12)
          zip="$RUNNER_TEMP/koan-$VERSION-macos-$hash.zip"
          ditto -c -k --norsrc --noextattr payload "$zip"
          scripts/notarise.sh "$zip"
      - name: Notarise and staple the DMG
        run: |
          set -euo pipefail
          hash=$(shasum -a 256 artifacts/koan-macos-app/Koan.dmg | cut -c1-12)
          dmg="$RUNNER_TEMP/Koan-$VERSION-$hash.dmg"
          cp artifacts/koan-macos-app/Koan.dmg "$dmg"
          scripts/notarise.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mkdir stapled
          cp "$dmg" stapled/Koan.dmg
      - name: Replace the release's DMG
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release's DMG cannot be replaced"
            exit 1
          fi
          gh release upload "v$VERSION" stapled/Koan.dmg --clobber
      - name: Update the Homebrew cask
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the Homebrew cask cannot be updated"
            exit 1
          fi
          DMG_SHA=$(shasum -a 256 stapled/Koan.dmg | awk '{print $1}')
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-koan.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          # Named koan-app so `brew install koan` stays the command-line player.
          cat > Casks/koan-app.rb <<CASK
          cask "koan-app" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/radiosilence/koan/releases/download/v#{version}/Koan.dmg"
            name "koan"
            desc "Bit-perfect music player"
            homepage "https://github.com/radiosilence/koan"

            depends_on macos: :tahoe

            app "kōan.app"

            zap trash: "~/.config/koan"
          end
          CASK
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update koan-app to v${VERSION}"
          git push
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # After the container image and the release: a published package promises
  # an image that exists, and never names a release that never happened.
  publish-package:
    name: Publish Pulumi package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Before the release: the updater that deploys koan follows releases, and
    # a release it finds must already have its package. After every other job
    # has passed, as the crates are: a published package version cannot be
    # reused.
    needs: [fmt, css, linux, msrv, audit, apple, create-release, container-release, check-version]
    # The package pins the image by version, so the version tag must exist.
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && needs.container-release.result == 'success' && needs.check-version.outputs.should_release == 'true' }}
    permissions:
      packages: write
      contents: read
    defaults:
      run:
        working-directory: deploy/pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
