name: iOS

# Builds the iOS and tvOS apps for a device, signs them and uploads them to
# TestFlight, one after the other on one runner.
#
# Called by CI/CD on every push to main that passes: iOS always, tvOS for a
# release. The version is the workspace's and the build number rises with the
# time. Called rather than listening for the release event: releases are
# published with the workflow token, and events raised by that token start no
# other workflows. Runnable by hand for a build between releases, for either
# platform: a dispatch from a branch should not put its shared code on the
# other platform's TestFlight.
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to upload
        type: choice
        options: [both, ios, tvos]
        default: both

jobs:
  # Without the App Store Connect key and the team there is nothing to sign
  # with. This answers that on a cheap runner, and the upload is skipped rather
  # than failing the release.
  signable:
    name: Signing configured
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No App Store Connect key or team configured; skipping TestFlight."
          fi

  testflight:
    name: TestFlight
    needs: signable
    if: needs.signable.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      IOS: ${{ inputs.platform != 'tvos' }}
      TVOS: ${{ inputs.platform != 'ios' }}
    # One group per platform set: a group keeps a single pending run, and a
    # release's (`both`) must not be replaced by a later push's (`ios`).
    concurrency:
      group: testflight-${{ inputs.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-tvos
      # The engine builds for iOS into a target directory of its own (see
      # `ios-ffi`), which rust-cache does not look in unless told. Saved even
      # when the archive fails: the Rust built fine, and a failed upload
      # otherwise starts the next attempt from nothing.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: testflight
          cache-on-failure: true
          workspaces: |
            . -> target/ios-26.0
            . -> target/tv-26.0
            . -> target
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: brew install xcodegen uv
      # The key is the one the macOS release notarises with: one App Store
      # Connect key serves both, and it needs the Admin role for the
      # cloud-managed signing `ios-testflight` relies on.
      - name: Stage the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      # Automatic signing archives with an Apple Development identity, and a
      # runner has none, so without this Xcode has Apple mint a new
      # certificate on every run until the account hits its limit and the
      # archive fails. One certificate, kept as a secret, is found in the
      # keychain and reused. Kept in 1Password as "Apple Development certificate for CI".
      - name: Import the Apple Development certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: env.IOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Development" \
            || { echo "::error::no Apple Development identity in IOS_CERTIFICATE_P12"; exit 1; }
      # A build number has to rise with every upload of a version. The run
      # number cannot: called from CI/CD it is that workflow's, dispatched by
      # hand it is this one's. The time always rises.
      - id: build
        run: echo "KOAN_BUILD=$(date -u +%s)" >> "$GITHUB_ENV"
      - if: env.IOS == 'true'
        run: just ios-testflight "$KOAN_BUILD"
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # The television app: the same record in App Store Connect, under its
      # tvOS platform. Tried when the phone's upload failed, but not when
      # setup did: without the certificate Xcode mints a new one each run.
      - if: ${{ !cancelled() && env.TVOS == 'true' && steps.build.outcome == 'success' }}
        run: just tv-testflight "$KOAN_BUILD"
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # What testers see when they install the build: this version's section
      # of the changelog. Waits for App Store Connect to finish processing,
      # so it comes after both uploads. The upload has happened by now; notes
      # that fail to land are not a failed release.
      - if: ${{ !cancelled() && env.IOS == 'true' && steps.build.outcome == 'success' }}
        run: uv run apps/ios/store/whats_new.py "$KOAN_BUILD"
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - if: ${{ !cancelled() && env.TVOS == 'true' && steps.build.outcome == 'success' }}
        run: uv run apps/ios/store/whats_new.py "$KOAN_BUILD" TV_OS
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
