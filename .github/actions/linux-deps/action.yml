name: Linux build dependencies
description: >
  Installs the ALSA and D-Bus headers koan builds against, and with `gui` the
  libraries the desktop app's GPUI links (xkbcommon, Wayland, fontconfig,
  FreeType, xcb, Vulkan). A mirror that trickles bytes never trips apt's own
  timeout, so each attempt is cut off after three minutes and tried again,
  rather than holding the job until its timeout-minutes cancels it.

inputs:
  gui:
    description: Also install what koan-gui builds against.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GUI: ${{ inputs.gui }}
      run: |
        set -uo pipefail
        packages=(libasound2-dev libdbus-1-dev)
        if [ "$GUI" = true ]; then
          packages+=(libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev \
            libfreetype-dev libx11-xcb-dev libvulkan-dev)
        fi
        for attempt in 1 2 3; do
          if sudo timeout 180 apt-get -o Acquire::Retries=3 update \
            && sudo timeout 180 apt-get -o Acquire::Retries=3 install -y "${packages[@]}"; then
            exit 0
          fi
          echo "::warning::linux-deps: attempt $attempt failed"
          sleep 10
        done
        echo "::error::linux-deps: apt failed three times"
        exit 1
