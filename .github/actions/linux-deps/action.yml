name: Linux build dependencies
description: >
  Installs the ALSA and D-Bus headers koan builds against. A mirror that
  trickles bytes never trips apt's own timeout, so each attempt is cut off
  after three minutes and tried again, rather than holding the job until its
  timeout-minutes cancels it.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -uo pipefail
        for attempt in 1 2 3; do
          if sudo timeout 180 apt-get -o Acquire::Retries=3 update \
            && sudo timeout 180 apt-get -o Acquire::Retries=3 install -y libasound2-dev libdbus-1-dev; then
            exit 0
          fi
          echo "::warning::linux-deps: attempt $attempt failed"
          sleep 10
        done
        echo "::error::linux-deps: apt failed three times"
        exit 1
