[workspace]
resolver = "2"
exclude = ["vendor"]
members = ["crates/koan-core", "crates/koan-ffi", "crates/koan-runtime", "crates/koan-gui", "crates/koan-kit", "crates/koan-server", "crates/koan-tui", "crates/koan-cli", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.69.6"
edition = "2024"
homepage = "https://github.com/radiosilence/koan"
repository = "https://github.com/radiosilence/koan"
license = "MIT"

[workspace.dependencies]
# kōan's push relay's client: radiosilence/koan-push-relay.
koan-relay-client = "0.1.2"
# Internal crates. Keep the version in step with [workspace.package] above —
# a stale pin here publishes members that resolve against the wrong sibling.
koan-core = { path = "crates/koan-core", version = "0.69.6" }
koan-server = { path = "crates/koan-server", version = "0.69.6" }
koan-tui = { path = "crates/koan-tui", version = "0.69.6" }
# Feature set is the union every member needs; `default-tls` is an alias for
# `rustls`, so there is exactly one TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "http2",
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"

# The desktop app's test loop (`just gui-run`): dependencies optimised fully,
# without their debug checks, built once and kept; the workspace's own crates at opt-level 1, rebuilt
# incrementally, with debug assertions and overflow checks on. Audio, the
# decoders and GPUI run at release speed while an edit rebuilds only the
# crates it touches.
[profile.gui-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.gui-dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[patch.crates-io]
# Our copies of GPUI's crates, patched until the patches are taken upstream
# (every change marked KOAN:; vendor/README.md lists them): an idle window
# stops waking every refresh (#1609), a shader primitive whose uniforms
# are read as each frame is presented (#1641), and a text caret whose blink
# is presented rather than drawn (#1786).
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-base = { path = "vendor/gpui-base" }
