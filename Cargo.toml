[workspace]
resolver = "2"
members = ["crates/koan-auth", "crates/koan-core", "crates/koan-ffi", "crates/koan-runtime", "crates/koan-gui", "crates/koan-kit", "crates/koan-server", "crates/koan-tui", "crates/koan-cli", "koan-kit-web", "tools/uniffi-bindgen", "tools/kit-reference"]

[workspace.package]
version = "0.77.2"
edition = "2024"
homepage = "https://koan.rocks"
repository = "https://github.com/radiosilence/koan"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# GPUI from koan's fork of Zed (radiosilence/zed, branch `koan`): Zed's GPUI
# with koan's commits, each proposed upstream, published as gpui-koan-*.
# Pinned to a revision; the library names stay Zed's (`gpui`,
# `gpui_platform`).
gpui = { package = "gpui-koan", git = "https://github.com/radiosilence/zed", rev = "5503f2420b127de55620308593f0c5aebeafdddb" }
# `font-kit` is the macOS text system: without it GPUI draws no text.
gpui_platform = { package = "gpui-koan-platform", git = "https://github.com/radiosilence/zed", rev = "5503f2420b127de55620308593f0c5aebeafdddb", features = ["font-kit"] }
# kōan's push relay's client: radiosilence/koan-push-relay.
koan-relay-client = "0.1.2"
# Internal crates. Keep the version in step with [workspace.package] above —
# a stale pin here publishes members that resolve against the wrong sibling.
koan-auth = { path = "crates/koan-auth", version = "0.77.2" }
koan-core = { path = "crates/koan-core", version = "0.77.2" }
koan-server = { path = "crates/koan-server", version = "0.77.2" }
koan-tui = { path = "crates/koan-tui", version = "0.77.2" }
# The kōan web kit's components, at the kit's own version rather than koan's: it is released on its own
# (koan-kit-web.yml), and release.sh leaves this pin alone, refusing a release while the kit in the tree has changed
# since its version last moved, so the published koan-server names a kit that holds what it was built against.
koan-kit-web = { path = "koan-kit-web", version = "0.9.0" }
# Feature set is the union every member needs; `default-tls` is an alias for
# `rustls`, so there is exactly one TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "http2",
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
walkdir = "2.5"

# The desktop app's test loop (`just gui-run`): dependencies optimised fully,
# without their debug checks, built once and kept; the workspace's own crates at opt-level 1, rebuilt
# incrementally, with debug assertions and overflow checks on. Audio, the
# decoders and GPUI run at release speed while an edit rebuilds only the
# crates it touches.
[profile.gui-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.gui-dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
