[workspace]
resolver = "2"
members = ["crates/koan-core", "crates/koan-ffi", "crates/koan-runtime", "crates/koan-gui", "crates/koan-kit", "crates/koan-server", "crates/koan-tui", "crates/koan-cli", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.72.1"
edition = "2024"
homepage = "https://github.com/radiosilence/koan"
repository = "https://github.com/radiosilence/koan"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# GPUI from koan's fork of Zed (radiosilence/zed, branch `koan`): Zed's GPUI
# with koan's commits, each proposed upstream, published as gpui-koan-*.
# Pinned to a revision; the library names stay Zed's (`gpui`,
# `gpui_platform`).
gpui = { package = "gpui-koan", git = "https://github.com/radiosilence/zed", rev = "26bae046a38126b776c702b1eab5cabc7a4cf4e2" }
# `font-kit` is the macOS text system: without it GPUI draws no text.
gpui_platform = { package = "gpui-koan-platform", git = "https://github.com/radiosilence/zed", rev = "26bae046a38126b776c702b1eab5cabc7a4cf4e2", features = ["font-kit"] }
# kōan's push relay's client: radiosilence/koan-push-relay.
koan-relay-client = "0.1.2"
# Internal crates. Keep the version in step with [workspace.package] above —
# a stale pin here publishes members that resolve against the wrong sibling.
koan-core = { path = "crates/koan-core", version = "0.72.1" }
koan-server = { path = "crates/koan-server", version = "0.72.1" }
koan-tui = { path = "crates/koan-tui", version = "0.72.1" }
# Feature set is the union every member needs; `default-tls` is an alias for
# `rustls`, so there is exactly one TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "http2",
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"

# The desktop app's test loop (`just gui-run`): dependencies optimised fully,
# without their debug checks, built once and kept; the workspace's own crates at opt-level 1, rebuilt
# incrementally, with debug assertions and overflow checks on. Audio, the
# decoders and GPUI run at release speed while an edit rebuilds only the
# crates it touches.
[profile.gui-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.gui-dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
