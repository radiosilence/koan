[workspace]
resolver = "2"
members = ["crates/koan-core", "crates/koan-ffi", "crates/koan-server", "crates/koan-tui", "crates/koan-cli", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.52.8"
edition = "2024"
rust-version = "1.89"
homepage = "https://github.com/radiosilence/koan"
repository = "https://github.com/radiosilence/koan"
license = "MIT"

[workspace.dependencies]
# Internal crates. Keep the version in step with [workspace.package] above —
# a stale pin here publishes members that resolve against the wrong sibling.
koan-core = { path = "crates/koan-core", version = "0.52.8" }
koan-server = { path = "crates/koan-server", version = "0.52.8" }
koan-tui = { path = "crates/koan-tui", version = "0.52.8" }
# Feature set is the union every member needs; `default-tls` is an alias for
# `rustls`, so there is exactly one TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "charset",
  "http2",
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2.5"

# opus-decoder from radiosilence/Rusopus: upstream master, which replaces the
# direct-DFT CELT transform 0.1.1 shipped (a third of a phone core per stream,
# TadeuszWolfGang/Rusopus#2, unreleased), plus our fixes on top, each sent
# upstream. Fix bugs there; drop this once a release carries them.
[patch.crates-io]
opus-decoder = { git = "https://github.com/radiosilence/Rusopus", rev = "b935bbe0d92085b801b4dc46406b92b8b45f9b76" }
