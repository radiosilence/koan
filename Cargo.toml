[workspace]
resolver = "2"
members = ["crates/koan-core", "crates/koan-ffi", "crates/koan-server", "crates/koan-tui", "crates/koan-cli", "tools/uniffi-bindgen"]
# Patched crates kept here until upstream ships the fix: see vendor/README.md.
exclude = ["vendor"]

[workspace.package]
version = "0.52.7"
edition = "2024"
rust-version = "1.89"
homepage = "https://github.com/radiosilence/koan"
repository = "https://github.com/radiosilence/koan"
license = "MIT"

[workspace.dependencies]
# Internal crates. Keep the version in step with [workspace.package] above —
# a stale pin here publishes members that resolve against the wrong sibling.
koan-core = { path = "crates/koan-core", version = "0.52.7" }
koan-server = { path = "crates/koan-server", version = "0.52.7" }
koan-tui = { path = "crates/koan-tui", version = "0.52.7" }
# Feature set is the union every member needs; `default-tls` is an alias for
# `rustls`, so there is exactly one TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "charset",
  "http2",
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2.5"

# opus-decoder 0.1.1 computes CELT's FFT as a direct DFT with a sin/cos per
# term; the copy in vendor/ plans a real FFT. See vendor/README.md.
[patch.crates-io]
opus-decoder = { path = "vendor/opus-decoder" }
