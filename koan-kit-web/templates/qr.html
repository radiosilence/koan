{#- Dark modules on white, inside the quiet zone, each a whole square; named by its label or hidden beside words. -#}
<div class="qr{{ attrs.classes() }}"{{ attrs }}><svg viewBox="0 0 {{ side }} {{ side }}" shape-rendering="crispEdges"
