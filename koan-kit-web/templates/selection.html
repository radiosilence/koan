{#- Rows to tick, as a form: its own boxes sent under its name, and the counts, bars and conditional actions it keeps
    in step with them. -#}
<form{% if !attrs.classes().is_empty() %} class="{{ attrs.class_names() }}"{% endif %} data-kit-selection data-name="{{ name }}"
{%- if let Some(total) = total %} data-total="{{ total }}"{% endif %}
{%- if let Some(none) = none.present() %} data-none="{{ none }}"{% endif %}
{%- if !all_tags.is_empty() %} data-all-tags="{{ self.all_tags() }}"{% endif %}{{ attrs }} data-init="{{ crate::selection::COUNT }}" data-on:change="{{ crate::selection::CHANGE }}" data-on:datastar-fetch__document="{{ crate::selection::PATCHED }}">
{{- rows -}}
</form>
