# rustls-webpki, both aws-lc-sys, quinn-proto, crossbeam-epoch, rmcp, anyhow and
# both rand entries.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste, unmaintained; transitive, no upgrade path
    "RUSTSEC-2026-0253", # lru, panic safety in LruCache::pop; transitive
]
