# Advisories present in the current lockfile, acknowledged so that `cargo audit`
# still fails on anything NEW. Remove entries as the dependency work clears them —
# an ignore that outlives its cause is worse than no gate at all.
#
# The v0.24.0 dependency refresh cleared the other thirteen: h2, all four
# rustls-webpki, both aws-lc-sys, quinn-proto, crossbeam-epoch, rmcp, anyhow and
# both rand entries.
[advisories]
ignore = [
    # paste, unmaintained. Held by lofty; nothing here can move it.
    "RUSTSEC-2024-0436",
    # lru, panic safety in `LruCache::pop`. Patched in 0.18.2, and koan and
    # ratatui are both past that — the affected 0.16.4 is held by
    # async-graphql 7.2.1, which is its own latest release. Drop this the
    # moment async-graphql ships one that has moved.
    "RUSTSEC-2026-0253",
    # webpki-roots, the distrusted emSign root. Fixed in 1.0.10, which the
    # lockfile holds; the version flagged is 0.26.11, a shim that re-exports
    # 1.x and so carries 1.0.10's roots. tungstenite 0.30, its own latest
    # release, requires ^0.26. Drop this when tungstenite moves to 1.x.
    "RUSTSEC-2026-0381",
]
