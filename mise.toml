[tools]
rust = "latest"
just = "latest"
lefthook = "2.2.2"
"github:tailwindlabs/tailwindcss" = "4.3.3"
# Typechecks the web UI's scripts; build.rs strips their types.
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v" }
xcodegen = "2.46.0"
# The Android app: Gradle's JDK, and the Rust core cross-compiled against the NDK.
java = "temurin-21.0.12+8.0.LTS"
"cargo:cargo-ndk" = "4.1.2"
