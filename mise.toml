[tools]
rust = "latest"
just = "latest"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
lefthook = "2.2.2"
"github:tailwindlabs/tailwindcss" = "4.3.3"
# Installs the theme the stylesheets import (package.json).
aube = "2.8.5"
# Runs the theme's kit-check in `just css` and the site's css task.
node = "24.22.3"
# Bundles the Zod the web scripts import into one module (`just zod`).
bun = "1.4.5"
# Typechecks the web UI's scripts; build.rs strips their types.
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v" }
xcodegen = "2.46.0"
# The Android app: Gradle's JDK, and the Rust core cross-compiled against the NDK.
java = "temurin-21.0.13+9.0.LTS"
"cargo:cargo-ndk" = "4.1.2"
# Formats the askama templates (`just fmt`) and checks them in CI, as the editor does.
# Our own tool, so mise's wait before installing a new release is off: CI runs the
# release the editor runs.
"github:radiosilence/askama-analyzer" = { version = "latest", minimum_release_age = "0" }
