<!doctype html>
<!--
  The link preview, public/og.jpg: this page at 1200x630, screenshotted by a headless Chrome from site/ and saved
  as JPEG. It draws on public/screens, so make it again when those change:
    chrome --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --allow-file-access-from-files --screenshot=og.png "file://$PWD/src/og.html"
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "Geist Mono";
      src: url("../public/geist-mono.woff2") format("woff2-variations");
      font-weight: 100 900;
    }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: "Geist Mono", ui-monospace, monospace;
      color: #ededed;
      background:
        radial-gradient(60% 80% at 82% 30%, rgb(150 52 128 / 0.55), transparent 70%),
        radial-gradient(45% 60% at 60% 95%, rgb(214 120 52 / 0.35), transparent 70%),
        radial-gradient(40% 50% at 10% 10%, rgb(125 211 167 / 0.12), transparent 70%),
        #151515;
    }

    .copy {
      position: absolute;
      left: 76px;
      top: 92px;
      width: 470px;
    }

    .icon {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 18px 40px rgb(0 0 0 / 0.45);
    }

    h1 {
      margin: 30px 0 0;
      font-size: 124px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    p {
      margin: 18px 0 0;
      font-size: 27px;
      line-height: 1.3;
      color: #c4c4c4;
    }

    .pills {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .pills span {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 18px;
      white-space: nowrap;
      font-weight: 600;
      color: #141414;
    }

    .mac {
      position: absolute;
      left: 560px;
      top: 70px;
      width: 760px;
      border-radius: 14px;
      box-shadow: 0 30px 80px rgb(0 0 0 / 0.6);
    }

    .phone {
      position: absolute;
      left: 905px;
      top: 168px;
      width: 236px;
      border-radius: 38px;
      border: 1px solid rgb(255 255 255 / 0.14);
      box-shadow: 0 30px 70px rgb(0 0 0 / 0.65);
    }
  </style>
</head>
<body>
  <div class="copy">
    <img class="icon" src="../public/icon-192.png" alt="">
    <h1>kōan</h1>
    <p>A music player for your own library, on your own server.</p>
    <div class="pills">
      <span style="background: #7dd3a7">Bit-perfect</span>
      <span style="background: #e7a6d8">Offline</span>
      <span style="background: #f0b45a">Open source</span>
    </div>
  </div>
  <img class="mac" src="../public/screens/mac-album.webp" alt="">
  <img class="phone" src="../public/screens/ios-now-playing.webp" alt="">
</body>
</html>
