<!doctype html>
<!--
  The homepage's top image, public/screens/hero.webp: the macOS app in front, with the web UI and the iPhone app behind it on either side. This page
  at 1600x1000, screenshotted by a headless Chrome from site/ with a transparent background, then saved as WebP. It
  draws on public/screens, so make it again when those change:
    chrome --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1600,1000 \
      --default-background-color=00000000 --allow-file-access-from-files --screenshot=hero.png "file://$PWD/src/hero.html"
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: transparent;
    }

    img {
      position: absolute;
      display: block;
    }

    /* The two behind, either side, smaller and set back: the web UI on the
       left, the iPhone on the right. */
    .web {
      left: 20px;
      top: 300px;
      width: 640px;
      border-radius: 10px;
      box-shadow: 0 18px 44px rgb(0 0 0 / 0.4);
      opacity: 0.82;
    }

    .phone {
      right: 50px;
      top: 185px;
      width: 290px;
      border-radius: 46px;
      border: 1px solid rgb(255 255 255 / 0.12);
      box-shadow: 0 18px 44px rgb(0 0 0 / 0.4);
      opacity: 0.82;
    }

    /* The Mac in front, centred, with the strongest shadow. */
    .mac {
      left: 300px;
      top: 187px;
      width: 1000px;
      border-radius: 16px;
      box-shadow: 0 44px 110px rgb(0 0 0 / 0.65);
      z-index: 1;
    }
  </style>
</head>
<body>
  <img class="web" src="../public/screens/web-search.webp" alt="">
  <img class="phone" src="../public/screens/ios-now-playing.webp" alt="">
  <img class="mac" src="../public/screens/mac-album.webp" alt="">
</body>
</html>
