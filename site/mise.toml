[tools]
# Standalone binaries, so the site has no package manifest: the Tailwind CLI for the stylesheet, pandoc for the
# documentation pages.
"github:tailwindlabs/tailwindcss" = "4"
pandoc = "3.12"

[tasks.docs]
description = "Render docs/ and the changelog into public/docs/"
run = "src/docs.sh"

# The stylesheet's classes are read from the rendered pages, so the docs come first.
[tasks.css]
description = "Compile the stylesheet into public/"
depends = ["docs"]
run = "tailwindcss --input src/style.css --output public/style.css --minify"
