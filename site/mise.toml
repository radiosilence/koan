[tools]
# The Tailwind CLI for the stylesheet, pandoc for the documentation pages, and nano-web, the server the image runs, for
# previewing. The stylesheet imports the kit's tokens from koan-kit-web/ in the tree.
"github:radiosilence/nano-web" = "1"
"github:tailwindlabs/tailwindcss" = "4"
pandoc = "3.12"

[tasks.docs]
description = "Render docs/ and the changelog into public/docs/"
run = "src/docs.sh"

# The stylesheet's classes are read from the rendered pages, so the docs come first.
[tasks.css]
description = "Compile the stylesheet into public/"
depends = ["docs"]
run = [
  "tailwindcss --input src/style.css --output public/style.css --minify",
  # src/og.html and src/hero.html are drawn into images, not served, so they are not checked.
  "node ../koan-kit-web/kit-check.mjs public src/docs.html",
]

# The web kit's storybook, from koan-kit-web/ as it is in this commit rather than as published, served at ui.koan.rocks (a
# route in jaritanet that prefixes /ui).
[tasks.ui]
description = "Build the web kit's storybook into public/ui/"
run = [
  "mkdir -p public/ui",
  "tailwindcss --input ../koan-kit-web/storybook/in.css --output public/ui/out.css --minify",
  "cp ../koan-kit-web/storybook/index.html ../koan-kit-web/geist-mono.woff2 public/ui/",
]

# nano-web, as in the image. --dev re-reads files as they change; rerun `mise run css` after editing docs or styles.
[tasks.preview]
description = "Build the site and serve it on http://localhost:3000"
depends = ["css", "ui"]
run = "nano-web serve public --port 3000 --dev"
