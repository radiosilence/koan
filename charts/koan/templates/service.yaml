apiVersion: v1
kind: Service
metadata:
  name: {{ include "koan.fullname" . }}
  labels:
    {{- include "koan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "koan.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: api
---
{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "koan.fullname" . }}-mcp
  labels:
    {{- include "koan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "koan.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.mcp.port }}
      targetPort: mcp
{{- end }}
